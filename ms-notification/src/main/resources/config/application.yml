# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.metrics.jdbc.DataSourcePoolMetricsAutoConfiguration
  application:
    name: notification
  cloud:
    function:
      definition: kafkaConsumer;kafkaProducer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          brokers: localhost:9092
      bindings:
        binding-out-0:
          content-type: text/plain
          group: notification
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: notification
        kafkaProducer-out-0:
          content-type: text/plain
          group: notification
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/postgresql.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://localhost:9080/realms/jhipster
        registration:
          oidc:
            client-id: internal
            client-secret: ${GIMAC_SECRET_INTERNAL:}
            scope: openid, profile, email, offline_access # last one for refresh tokens
  task:
    execution:
      thread-name-prefix: notification-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: notification-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'notificationApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: notification@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Notification API
    description: Notification API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    oauth2:
      audience:
        - account
        - api://default

# jhipster-needle-add-application-yaml-document
---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

---
# ---------------------------------------------------------------------------
# Notifications de la plateforme (D-80, docs/lot1/notifications.md) : jeton de service du client
# notification-service, adaptateurs MS-IAM et MS-COLLABORATION, consommateur des événements
# collaboration.message, pilotage.task, pilotage.report et iam.request (demandes à l'administration,
# docs/lot1/pouvoirs-hierarchiques.md §4), outbox de notification.inapp-created.v1.
# ---------------------------------------------------------------------------
spring:
  security:
    oauth2:
      client:
        registration:
          # Jeton de service (PI §0.7) : client Keycloak notification-service (INTERNAL_IAM_READ,
          # INTERNAL_COLLABORATION_READ), secret fourni par l'environnement, jamais dans le dépôt.
          service-token:
            provider: oidc
            client-id: ${GIMAC_SERVICE_CLIENT_ID:notification-service}
            client-secret: ${GIMAC_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid
  kafka:
    # Producteur de l'outbox et consommateur : même courtier que le binder Spring Cloud Stream.
    bootstrap-servers: ${spring.cloud.stream.kafka.binder.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    # Consommateur des événements (@KafkaListener) : chaînes, lecture depuis le début d'un sujet pour un
    # nouveau groupe (aucun événement perdu au premier démarrage).
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
gimac:
  outbox:
    delay: 500
  # Sélection des adaptateurs, un port à la fois (PI §0.8) : real | stub.
  adapters:
    # Noms affichés de l'annuaire interne de MS-IAM.
    annuaire: stub
    # Nom des conversations de groupe de MS-COLLABORATION.
    conversations: stub
  # Services joints par les adaptateurs réels (surchargés par l'environnement).
  services:
    iam:
      url: http://localhost:8081
    collaboration:
      url: http://localhost:8093
  notification:
    # Noms affichés mis en cache 5 min, conversations 60 s (un groupe renommé apparaît vite).
    cache-noms-secondes: 300
    cache-conversations-secondes: 60
    # Purge des notifications de plus de 90 jours (§2), chaque nuit (UTC).
    purge:
      cron: '0 17 3 * * *'
  kafka:
    rebut:
      actif: true
      nombre-tentatives: 3
      intervalle-ms: 1000
      # Sujets consommés : leur file de rebut (.dlt) est créée au démarrage.
      topics-surveilles:
        - collaboration.message
        - pilotage.task
        - pilotage.report
        - iam.request
        - pilotage.process
  consommateurs:
    notification:
      # pilotage.process : processus d'unité (D-87, type PROCESSUS).
      sujets: collaboration.message,pilotage.task,pilotage.report,iam.request,pilotage.process
