spring:
  cloud:
    function:
      definition: kafkaConsumer;kafkaProducer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          brokers: localhost:9092
      bindings:
        binding-out-0:
          content-type: text/plain
          group: audit
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: audit
        kafkaProducer-out-0:
          content-type: text/plain
          group: audit
  # Consommateurs @KafkaListener du registre (D-93 §11) : même courtier que le binder, chaînes, lecture depuis le début
  # d'un sujet pour un nouveau groupe (aucune signature perdue au premier démarrage).
  kafka:
    bootstrap-servers: ${spring.cloud.stream.kafka.binder.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

gimac:
  kafka:
    rebut:
      actif: true
      nombre-tentatives: 3
      intervalle-ms: 1000
      # Sujets consommés : leur file de rebut (.dlt) est créée au démarrage.
      topics-surveilles:
        - pilotage.process
        - homologation.operation
  consommateurs:
    signatures:
      # Signatures de processus d'unité (pilotage.process-step-signed.v1) et d'opérations d'homologation
      # (homologation.operation-signed.v1), scellées au registre (groupe audit-signatures).
      sujets: pilotage.process,homologation.operation
    # Événements à effet des onze services de la Sandbox GIMAC (US-EXI-10) : sujets nommés par le type
    # (sbx-<service>.<agrégat>-<événement>.v<n>, comme le relais de SBX-ESPACE) ou par l'agrégat, par motif (files de rebut
    # exclues), groupe audit-sandbox ; enveloppes non conformes au rebut (table rebut_sandbox).
    sandbox:
      motif: 'sbx-[a-z0-9]+\.[a-z0-9-]+(\.v[0-9]+)?'
  audit:
    sandbox:
      # Alerte de retard de consommation (AUD-07) : levée quand le rebut des enveloppes de la sandbox dépasse ce seuil.
      seuil-rebut: 10
