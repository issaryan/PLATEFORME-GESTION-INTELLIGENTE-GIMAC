# Spring Framework 7 met en pause les contextes de test inutilisés puis les redémarre à leur réutilisation : le redémarrage
# relance tous les consommateurs @KafkaListener, y compris ceux à démarrage manuel (gimac.consommateurs.demarrage-automatique
# à false), qui liraient alors le courtier localhost:9092 de la recette de la sandbox (US-EXI-10). Aucune pause.
spring.test.context.cache.pause=never
