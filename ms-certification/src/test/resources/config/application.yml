# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  kafka:
    # Comme en principal : le liant Spring Cloud Stream imposerait ByteArraySerializer.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  application:
    name: certification
  cloud:
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    datatype:
      datetime:
        write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://DO_NOT_CALL:9080/realms/jhipster
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
  task:
    execution:
      thread-name-prefix: certification-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: certification-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  mail:
    from: certification@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false

# Lot 1 : adaptateurs de substitution et paramètres métier des tests (PI §0.8).
gimac:
  # Consommateurs Kafka démarrés à la demande par les tests qui les éprouvent.
  consommateurs:
    demarrage-automatique: false
  outbox:
    delay: 500
  adapters:
    homologation-reader: stub
    document-deposit: stub
    reauthentication: stub
    key-vault-signing: stub
    change-record-reader: stub
  services:
    homologation:
      url: http://localhost:8086
    document:
      url: http://localhost:8083
    iam:
      url: http://localhost:8081
  certification:
    change-record: {freshness: PT15M}
    # Visas activés pour le délégataire dans les tests (scénarios des visas) ; désactivés ailleurs.
    visas:
      conformite: DELEGATAIRE
      direction-generale: DELEGATAIRE
  kafka:
    rebut:
      actif: false
  securite:
    double-facteur:
      exige: true
      niveaux-acr: 2,3
