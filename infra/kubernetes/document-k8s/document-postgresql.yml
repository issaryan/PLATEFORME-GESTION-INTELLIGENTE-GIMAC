apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: document-postgresql-pvc
  namespace: gimac-des
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: document-postgresql
  namespace: gimac-des
  labels:
    app: document-postgresql
type: Opaque
data:
  postgresql-password: MWU2Y2VkNGM0NGNkZTU3YzIzNjhkYzEyYjhkN2VlM2U5OWMwNThiMDc5NzkyOGYxYjY1ZDZiZWQ1YjVi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-postgresql
  namespace: gimac-des
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-postgresql
  template:
    metadata:
      labels:
        app: document-postgresql
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: document-postgresql-pvc
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              value: document
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: document-postgresql
                  key: postgresql-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: document-postgresql
  namespace: gimac-des
spec:
  selector:
    app: document-postgresql
  ports:
    - port: 5432
