# Domaine Keycloak « gimac » du lot 1 (D-61, D-62) : émetteur des jetons, client de service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: gimac-des
spec:
  template:
    spec:
      containers:
        - name: iam-app
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI
              value: http://keycloak.gimac-des.des.gimac.local/realms/gimac
            - name: GIMAC_SERVICE_CLIENT_ID
              value: iam-service
            - name: GIMAC_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: iam-service
            # API d'administration jointe par l'entrée, comme l'émetteur (politiques-reseau.yaml).
            - name: GIMAC_KEYCLOAK_URL
              value: http://keycloak.gimac-des.des.gimac.local
            - name: GIMAC_WEBAUTHN_RP_ID
              value: des.gimac.local
            - name: GIMAC_WEBAUTHN_ORIGINES
              value: https://departement.des.gimac.local,https://portail.des.gimac.local,https://console.des.gimac.local
