# Domaine Keycloak « gimac » du lot 1 (D-61, D-62) : émetteur des jetons ; Mon activité (D-76) : client de
# service pilotage-service, organisation de MS-IAM et documents de MS-DOCUMENT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilotage
  namespace: gimac-des
spec:
  template:
    spec:
      containers:
        - name: pilotage-app
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI
              value: http://keycloak.gimac-des.des.gimac.local/realms/gimac
            - name: GIMAC_SERVICE_CLIENT_ID
              value: pilotage-service
            - name: GIMAC_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: pilotage-service
