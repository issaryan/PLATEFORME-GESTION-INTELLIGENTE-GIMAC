# Domaine Keycloak « gimac » du lot 1 (D-61, D-62) : émetteur des jetons, client de service ;
# messagerie de travail (D-64) : clé de chiffrement au repos des messages, hors base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collaboration
  namespace: gimac-des
spec:
  template:
    spec:
      containers:
        - name: collaboration-app
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI
              value: http://keycloak.gimac-des.des.gimac.local/realms/gimac
            - name: GIMAC_SERVICE_CLIENT_ID
              value: collaboration-service
            - name: GIMAC_SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: collaboration-service
            - name: GIMAC_MESSAGERIE_CLE
              valueFrom:
                secretKeyRef:
                  name: gimac-messagerie
                  key: cle-chiffrement
