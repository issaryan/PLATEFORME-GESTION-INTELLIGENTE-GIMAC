# Keycloak de la plateforme (D-62) : image construite depuis infra/keycloak/Dockerfile (thème GIMAC et
# domaine « gimac » intégrés), administrateur d'amorçage et secrets des clients lus dans des Secrets
# créés par creer-secrets.sh ; le realm JHipster généré reste importé depuis sa ConfigMap.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: gimac-des
spec:
  template:
    spec:
      containers:
        - name: keycloak
          image: registre.gimac.local/des/keycloak:26.7.4-gimac
          env:
            - name: KEYCLOAK_ADMIN
              $patch: delete
            - name: KEYCLOAK_ADMIN_PASSWORD
              $patch: delete
            # Options de nom d'hôte et de mandataire de la v1 (KC_HOSTNAME_URL, KC_HOSTNAME_ADMIN_URL, KC_PROXY),
            # retirées de Keycloak 26 : remplacées par celles de la v2. En mode « start », Keycloak exige un nom
            # d'hôte et refuse le HTTP sans KC_HTTP_ENABLED (TLS terminé au contrôleur d'entrée).
            - name: KC_PROXY
              $patch: delete
            - name: KC_HOSTNAME_URL
              $patch: delete
            - name: KC_HOSTNAME_ADMIN_URL
              $patch: delete
            - name: KC_HOSTNAME
              value: http://keycloak.gimac-des.des.gimac.local
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            # Sonde de santé sur le port de gestion, comme Docker Compose (KC_HTTP_MANAGEMENT_PORT=9990) : lue par
            # la supervision de la passerelle (gimac.supervision.keycloak-sante-url).
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_MANAGEMENT_PORT
              value: "9990"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: gimac-admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: GIMAC_MOT_DE_PASSE_TEST
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: mot-de-passe-test
            - name: GIMAC_SECRET_TESTER_CLI
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: tester-cli
            - name: GIMAC_SECRET_HOMOLOGATION_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: homologation-service
            - name: GIMAC_SECRET_CERTIFICATION_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: certification-service
            - name: GIMAC_SECRET_PARTICIPANT_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: participant-service
            - name: GIMAC_SECRET_IAM_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: iam-service
            - name: GIMAC_SECRET_GATEWAY_SUPERVISION
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: gateway-supervision
            - name: GIMAC_SECRET_COLLABORATION_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: collaboration-service
            - name: GIMAC_SECRET_PILOTAGE_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: pilotage-service
            - name: GIMAC_SECRET_MONITORING_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: monitoring-service
            - name: GIMAC_SECRET_NOTIFICATION_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: notification-service
            # Reprise de l'existant (D-107) : client reprise-service.
            - name: GIMAC_SECRET_REPRISE_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: reprise-service
            # Sandbox GIMAC (D-119) : clients sbx-*.
            - name: GIMAC_SECRET_SBX_ESPACE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: sbx-espace
            - name: GIMAC_SECRET_INTERNAL
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: internal
            # Connexion sur la plateforme (D-65) : clients d'octroi direct et jeton de service de la passerelle.
            - name: GIMAC_SECRET_CONNEXION
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: connexion
            - name: GIMAC_SECRET_WEB_APP
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: web-app
            - name: GIMAC_SECRET_GATEWAY_SERVICE
              valueFrom:
                secretKeyRef:
                  name: gimac-clients-keycloak
                  key: gateway-service
          ports:
            - name: management
              containerPort: 9990
          volumeMounts:
            - name: keycloak-volume
              mountPath: /opt/keycloak/data/import
              $patch: delete
            - name: keycloak-volume
              mountPath: /opt/keycloak/data/import/jhipster-realm.json
              subPath: jhipster-realm.json
