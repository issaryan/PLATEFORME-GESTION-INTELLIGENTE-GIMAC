# Domaine Keycloak « gimac » du lot 1 (D-61, D-62) : émetteur des jetons.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document
  namespace: gimac-des
spec:
  template:
    spec:
      containers:
        - name: document-app
          env:
            - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI
              value: http://keycloak.gimac-des.des.gimac.local/realms/gimac
            # Dépôt WORM (D-50) : passerelle Ceph RGW de la zone de persistance et clés d'accès,
            # fournies par l'exploitant (Secret gimac-stockage-objet, voir creer-secrets.sh).
            - name: GIMAC_S3_POINT_ACCES
              valueFrom:
                secretKeyRef:
                  name: gimac-stockage-objet
                  key: point-acces
            - name: GIMAC_S3_CLE_ACCES
              valueFrom:
                secretKeyRef:
                  name: gimac-stockage-objet
                  key: cle-acces
            - name: GIMAC_S3_CLE_SECRETE
              valueFrom:
                secretKeyRef:
                  name: gimac-stockage-objet
                  key: cle-secrete
            # Dépôts fragmentés en cours (D-74) : compartiment sans verrouillage d'objets, créé par
            # l'exploitant avec ses règles de cycle de vie (objets expirés après 2 jours, téléversements
            # incomplets abandonnés après 1 jour), comme init-compartiments.sh en développement.
            - name: GIMAC_S3_COMPARTIMENT_DEPOTS
              value: gimac-depots
