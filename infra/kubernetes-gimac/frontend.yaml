# Couches de présentation (D-46, D-51) : nginx sans privilège, conforme au profil restricted.
# Images construites avec SERVICES=http (services réels de la passerelle, défaut du Dockerfile) ; chaque
# couche est servie à la racine de son hôte et route /des, /portail ou /console elle-même.
# Zone réseau d'origine (CC 5.6.1, D-24) : portail en DMZ, application du département en zone
# applicative, console en zone d'administration hors bande. Seule la passerelle est jointe.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-departement
  namespace: gimac-des
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-departement
  template:
    metadata:
      labels:
        app: frontend-departement
        gimac.cm/segment: presentation
        gimac.cm/zone: applicative
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-departement
          image: registre.gimac.local/des/frontend-departement:0.1.0
          env:
            - name: GIMAC_PASSERELLE
              value: http://gateway.gimac-des.svc.cluster.local:8080
            - name: GIMAC_RESOLVEUR
              value: kube-dns.kube-system.svc.cluster.local
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /sante, port: http }
          livenessProbe:
            httpGet: { path: /sante, port: http }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-departement
  namespace: gimac-des
spec:
  selector:
    app: frontend-departement
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-departement
  namespace: gimac-des
  annotations:
    # Flux SSE (canal poussé /bff/<couche>/live, supervision /api/plateforme/flux) : ni mise en tampon
    # ni coupure de la connexion longue par le contrôleur d'entrée.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: departement.des.gimac.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-departement
                port:
                  name: http
