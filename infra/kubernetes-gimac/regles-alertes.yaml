# Généré par synchroniser-partages.sh depuis infra/docker-compose/prometheus-conf/alert_rules.yml :
# ne pas modifier à la main. Sélectionné par la ressource Prometheus jhipster-prometheus (ruleSelector).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gimac-alertes
  namespace: gimac-des
  labels:
    team: gimac-des
spec:
  groups:
    - name: example
      rules:
        - alert: InstanceDown
          # Based on https://prometheus.io/docs/prometheus/latest/configuration/template_examples/
          expr: up == 0
          for: 10s
          labels:
            severity: page
          annotations:
            summary: "Instance {{$labels.instance}} down"
            description: "{{$labels.instance}} of job {{$labels.job}} has been down for more than 10 seconds."
