executeActionsSubject=Plateforme DES du GIMAC : activez votre compte
executeActionsBody=Un compte vous a été ouvert sur la plateforme de suivi des activités du DES ({2}). Pour l''activer, suivez le lien ci-dessous et réalisez les étapes demandées : {3}.\n\n{0}\n\nCe lien expire dans {4}. À la première connexion, vous compléterez votre fiche et configurerez votre second facteur d''authentification.\n\nSi vous n''attendiez pas ce message, ignorez-le et signalez-le au RSSI.
executeActionsBodyHtml=<p>Un compte vous a été ouvert sur la plateforme de suivi des activités du DES ({2}).</p><p>Pour l''activer, suivez le lien ci-dessous et réalisez les étapes demandées : {3}.</p><p><a href="{0}">Activer mon compte</a></p><p>Ce lien expire dans {4}. À la première connexion, vous compléterez votre fiche et configurerez votre second facteur d''authentification.</p><p>Si vous n''attendiez pas ce message, ignorez-le et signalez-le au RSSI.</p>
