executeActionsBody=Se le ha abierto una cuenta en la plataforma de seguimiento de las actividades del GIMAC ({2}). Para activarla, siga el enlace siguiente y realice los pasos solicitados: {3}.\n\n{0}\n\nEste enlace caduca en {4}. En el primer inicio de sesión completará su ficha y configurará su segundo factor de autenticación.\n\nSi no esperaba este mensaje, ignórelo e infórmelo al RSSI.
