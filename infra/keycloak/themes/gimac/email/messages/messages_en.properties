executeActionsBody=An account has been opened for you on the DES activity monitoring platform ({2}). To activate it, follow the link below and complete the requested steps: {3}.\n\n{0}\n\nThis link expires in {4}. At first sign-in you will complete your profile and set up your second authentication factor.\n\nIf you were not expecting this message, ignore it and report it to the CISO.
