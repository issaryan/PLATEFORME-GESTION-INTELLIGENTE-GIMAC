# Surcouche d'un poste de développement : Keycloak persistant, comme sur le serveur de démonstration
# (docker-compose.serveur.yml). Comptes, mots de passe et codes TOTP enrôlés survivent à la recréation
# du conteneur, que le mode dev-file de la base générée perd. Activée par GIMAC_COMPOSE_SUPPLEMENT
# dans le .env du poste ; le domaine est importé au premier démarrage, une version ultérieure de
# gimac-realm.json s'applique en conservant les comptes (voir README, « Keycloak persistant »).
services:
  keycloak-postgresql:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${GIMAC_KEYCLOAK_DB_PASSWORD:?à définir dans .env}
    volumes:
      - keycloak_donnees:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    depends_on:
      keycloak-postgresql:
        condition: service_healthy
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgresql:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${GIMAC_KEYCLOAK_DB_PASSWORD:?à définir dans .env}

volumes:
  keycloak_donnees:
