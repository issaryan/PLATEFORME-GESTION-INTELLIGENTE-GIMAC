global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
    monitor: "my-project"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - alert_rules.yml

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: "prometheus"

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    # scheme defaults to 'http'.
    metrics_path: /management/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - iam:8081
          - audit:8082
          - document:8083
          - notification:8084
          - participant:8085
          - homologation:8086
          - certification:8087
          - incident:8088
          - monitoring:8089
          - rapprochement:8090
          - pilotage:8091
          - reporting:8092
          - collaboration:8093

  # Complément GIMAC (D-61) : état des hôtes et des conteneurs pour la supervision de la
  # plateforme (/api/plateforme/serveurs). À reporter après une régénération par JHipster.
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  # Découverte par le DNS du réseau Compose : sans cAdvisor (profil « conteneurs » inactif),
  # aucune cible, donc ni cible « down » ni alerte InstanceDown.
  - job_name: "cadvisor"
    dns_sd_configs:
      - names:
          - cadvisor
        type: A
        port: 8080
        refresh_interval: 30s
