      - SPRING_DATASOURCE_URL=jdbc:postgresql://iam-postgresql:5432/iam
      - SPRING_DATASOURCE_USERNAME=iam
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_LIQUIBASE_URL=jdbc:postgresql://iam-postgresql:5432/iam
      - JHIPSTER_CACHE_REDIS_SERVER=redis://iam-redis:6379
      - JHIPSTER_CACHE_REDIS_CLUSTER=false
