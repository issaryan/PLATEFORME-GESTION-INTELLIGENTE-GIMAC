# Surcouche du serveur de démonstration (10.20.36.214), ajoutée par GIMAC_COMPOSE_SUPPLEMENT
# (infra/ci/deployer-serveur.sh). Seules les trois couches de présentation sont publiées sur le
# réseau ; passerelle et Keycloak restent derrière le pare-feu, joints par le relais nginx.
# Adresses publiques dans le .env du serveur : GIMAC_HOTE_PUBLIC, GIMAC_URL_DES, GIMAC_URL_PORTAIL,
# GIMAC_URL_CONSOLE, GIMAC_SESSION_TEMOIN_SECURISE=false (service en http sous une adresse IP).
services:
  # Keycloak persistant : comptes, mots de passe et codes TOTP survivent à la recréation du conteneur
  # (dev-file les perd). Domaine importé au premier démarrage ; une version nouvelle de
  # gimac-realm.json est appliquée par deployer-serveur.sh en conservant les comptes.
  keycloak-postgresql:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${GIMAC_KEYCLOAK_DB_PASSWORD:?à définir dans .env}
    volumes:
      - keycloak_donnees:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    depends_on:
      keycloak-postgresql:
        condition: service_healthy
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgresql:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${GIMAC_KEYCLOAK_DB_PASSWORD:?à définir dans .env}

  frontend-departement:
    build:
      args:
        URL_CONSOLE: ${GIMAC_URL_CONSOLE:?à définir dans .env}
    ports: !override
      - 0.0.0.0:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}:8080

  frontend-portail:
    ports: !override
      - 0.0.0.0:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}:8080

  frontend-console:
    build:
      args:
        URL_DEPARTEMENT: ${GIMAC_URL_DES:?à définir dans .env}
    ports: !override
      - 0.0.0.0:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}:8080

volumes:
  keycloak_donnees:
