# Surcouche du serveur de démonstration (10.20.36.214), ajoutée par GIMAC_COMPOSE_SUPPLEMENT
# (infra/ci/deployer-serveur.sh). Seules les trois couches de présentation sont publiées sur le
# réseau ; passerelle et Keycloak restent derrière le pare-feu, joints par le relais nginx.
# Adresses publiques dans le .env du serveur : GIMAC_HOTE_PUBLIC, GIMAC_URL_DES, GIMAC_URL_PORTAIL,
# GIMAC_URL_CONSOLE, GIMAC_SESSION_TEMOIN_SECURISE=false (service en http sous une adresse IP).
services:
  # Keycloak persistant : comptes, mots de passe et codes TOTP survivent à la recréation du conteneur
  # (dev-file les perd). Domaine importé au premier démarrage ; une version nouvelle de
  # gimac-realm.json est appliquée par deployer-serveur.sh en conservant les comptes.
  keycloak-postgresql:
    image: postgres:18.6
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${GIMAC_KEYCLOAK_DB_PASSWORD:?à définir dans .env}
    volumes:
      - keycloak_donnees:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    depends_on:
      keycloak-postgresql:
        condition: service_healthy
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-postgresql:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${GIMAC_KEYCLOAK_DB_PASSWORD:?à définir dans .env}

  frontend-departement:
    build:
      args:
        URL_DES: ${GIMAC_URL_DES:?à définir dans .env}
        URL_PORTAIL: ${GIMAC_URL_PORTAIL:?à définir dans .env}
        URL_CONSOLE: ${GIMAC_URL_CONSOLE:?à définir dans .env}
    ports: !override
      - 0.0.0.0:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}:8080

  frontend-portail:
    build:
      args:
        URL_DES: ${GIMAC_URL_DES:?à définir dans .env}
        URL_PORTAIL: ${GIMAC_URL_PORTAIL:?à définir dans .env}
        URL_CONSOLE: ${GIMAC_URL_CONSOLE:?à définir dans .env}
    ports: !override
      - 0.0.0.0:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}:8080

  frontend-console:
    build:
      args:
        URL_DEPARTEMENT: ${GIMAC_URL_DES:?à définir dans .env}
        URL_DES: ${GIMAC_URL_DES:?à définir dans .env}
        URL_PORTAIL: ${GIMAC_URL_PORTAIL:?à définir dans .env}
        URL_CONSOLE: ${GIMAC_URL_CONSOLE:?à définir dans .env}
    ports: !override
      - 0.0.0.0:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}:8080

  # Exploitation de l'infrastructure depuis la console (D-78, docs/exploitation/operations-infrastructure.md) :
  # la passerelle voit et pilote les conteneurs du projet gimac-des par le mandataire du moteur Docker,
  # jamais par le socket. Mandataire sur un réseau interne (aucun port publié, aucune sortie), socket en
  # lecture seule, liste fermée de l'API (exploitation/docker-socket-proxy.cfg) : liste, inspection et
  # journaux des conteneurs, start, stop, restart ; ni exec, ni création, ni suppression, ni images,
  # volumes, réseaux ou construction.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - PING=1
      # Écoute en IPv4 seulement (réseau interne du projet sans IPv6 ; sinon échec de l'écoute sur [::]).
      - DISABLE_IPV6=1
      - EVENTS=0
      - VERSION=0
      - INFO=0
      - IMAGES=0
      - EXEC=0
      - VOLUMES=0
      - NETWORKS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - GRPC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - AUTH=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./exploitation/docker-socket-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    networks:
      - exploitation
    security_opt:
      - no-new-privileges:true

  # Aperçu des documents bureautiques (D-83) : moteur de conversion déclaré dans docker-compose.gimac.yml (réseau
  # interne « conversion », aucun port publié, 1 Go de mémoire), relancé après un arrêt ou un redémarrage de l'hôte.
  conversion-documents:
    restart: unless-stopped

  # Passerelle : exploitation par le mandataire (réseau exploitation en plus du réseau du projet).
  # Conteneurs : CPU et mémoire par conteneur pour la supervision (job cadvisor de Prometheus). Optionnel
  # ailleurs (profil « conteneurs »), toujours actif sur le serveur ; aucun port publié, montages en lecture.
  cadvisor:
    profiles: !reset []
    command: ['--docker_only=true', '--housekeeping_interval=15s', '--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl']
    restart: unless-stopped

  gateway:
    environment:
      - GIMAC_ORCHESTRATEUR_TYPE=docker
      - GIMAC_ORCHESTRATEUR_DOCKER_URL=http://docker-socket-proxy:2375
      - GIMAC_ORCHESTRATEUR_DOCKER_PROJET=gimac-des
      # Supervision : seuls les conteneurs de la plateforme (le serveur héberge d'autres applications).
      - GIMAC_SUPERVISION_PROJETCONTENEURS=gimac-des
    networks:
      - default
      - exploitation

networks:
  # Réseau interne : ni accès extérieur ni port publié ; seuls la passerelle et le mandataire y sont.
  exploitation:
    internal: true

volumes:
  keycloak_donnees:
