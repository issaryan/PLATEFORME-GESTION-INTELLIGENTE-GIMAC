# Complément propre au projet GIMAC, fusionné avec docker-compose.yml.
#
# docker-compose.yml est produit par « jhipster docker-compose » (configuration
# dans .yo-rc.json) et ne doit pas être modifié à la main : on le régénère.
# Ce fichier ajoute seulement ce que JHipster ne génère pas (D-45, SOC-13) et
# surcharge ce que le référentiel impose (D-25 : Valkey, D-44 : aucun secret par défaut,
# D-50 : Ceph RGW comme dépôt objet WORM).
#
# Lancement : ./gimac-dev.sh demarrer   (fusionne les deux fichiers)
# Secrets : fichier .env local, créé par gimac-dev.sh, jamais versionné (BNF-07).

x-valkey: &valkey
  # D-25 : Valkey remplace Redis, dont la licence n'est plus libre.
  image: valkey/valkey:9.0.6-alpine

# Domaine Keycloak du lot 1 (PI-GIMAC-01) : jetons émis par le domaine « gimac ».
x-emetteur-gimac: &emetteur-gimac
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: http://keycloak:9080/realms/gimac
  # Secret du client de service « internal » des services générés (aucun secret dans le dépôt).
  GIMAC_SECRET_INTERNAL: ${GIMAC_SECRET_INTERNAL:?à définir dans .env}

# Les 14 services générés ne dépendent pas de Kafka dans docker-compose.yml : sans
# Kafka, leurs liaisons Spring Cloud Stream échouent et leur sonde reste en échec.
# Démarrés ensemble, ils dépassent aussi les 200 s tolérées par la sonde générée.
x-application: &application
  environment:
    <<: *emetteur-gimac
  depends_on:
    kafka:
      condition: service_started
  healthcheck:
    start_period: 240s
    retries: 60

x-sante: &sante
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

services:
  # ------------------------------------------------ Surcharges des services générés
  # Annuaire réel (D-62) : MS-IAM administre le domaine gimac par l'API d'administration de
  # Keycloak avec son compte de service ; vérifie les assertions FIDO2 des couches (IAM-07).
  iam:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: iam-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_IAM_SERVICE:?à définir dans .env}
      GIMAC_KEYCLOAK_URL: http://keycloak:9080
      GIMAC_WEBAUTHN_RP_ID: ${GIMAC_WEBAUTHN_RP_ID:-localhost}
      GIMAC_WEBAUTHN_ORIGINES: ${GIMAC_WEBAUTHN_ORIGINES:-http://localhost:4200,http://localhost:4201,http://localhost:4202}
  audit: *application
  # Dépôt direct de la tranche DDRM : adaptateur S3 réel vers Ceph RGW (D-50), démarré
  # après la création des compartiments WORM (le service vérifie le verrouillage d'objets).
  document:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_S3_POINT_ACCES: http://stockage-objet:7480
      GIMAC_S3_CLE_ACCES: ${GIMAC_S3_CLE_ACCES:?à définir dans .env}
      GIMAC_S3_CLE_SECRETE: ${GIMAC_S3_CLE_SECRETE:?à définir dans .env}
    depends_on:
      kafka:
        condition: service_started
      stockage-objet-init:
        condition: service_completed_successfully
  notification: *application
  participant:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: participant-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_PARTICIPANT_SERVICE:?à définir dans .env}
  homologation:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: homologation-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_HOMOLOGATION_SERVICE:?à définir dans .env}
  certification:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: certification-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_CERTIFICATION_SERVICE:?à définir dans .env}
  incident: *application
  monitoring: *application
  rapprochement: *application
  pilotage: *application
  reporting: *application
  # Messagerie de travail (D-64) : annuaire de MS-IAM et dépôt de MS-DOCUMENT par le jeton du client
  # collaboration-service ; clé de chiffrement au repos des messages hors base (.env).
  collaboration:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: collaboration-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_COLLABORATION_SERVICE:?à définir dans .env}
      GIMAC_MESSAGERIE_CLE: ${GIMAC_MESSAGERIE_CLE:?à définir dans .env}
      GIMAC_SERVICES_IAM_URL: http://iam:8081
      GIMAC_SERVICES_DOCUMENT_URL: http://document:8083
  gateway-valkey:
    <<: *valkey
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  iam-redis: *valkey
  document-redis: *valkey
  notification-redis: *valkey
  participant-redis: *valkey
  incident-redis: *valkey
  monitoring-redis: *valkey
  rapprochement-redis: *valkey
  pilotage-redis: *valkey
  reporting-redis: *valkey
  collaboration-redis: *valkey

  # Ports de l'hôte réglables dans .env (!override remplace la liste générée),
  # pour cohabiter avec d'autres projets du poste. Défauts : ports de JHipster.
  gateway:
    <<: *application
    depends_on:
      kafka:
        condition: service_started
      gateway-valkey:
        condition: service_healthy
    # Limitation de débit et révocations sur Valkey (GW-07, SOC-11, D-25) ; la dépendance
    # Redis réactive active aussi un indicateur de santé Redis.
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=http://keycloak:9080/realms/gimac
      - SPRING_DATA_REDIS_HOST=gateway-valkey
      - SPRING_DATA_REDIS_PORT=6379
      # Supervision de la plateforme (D-61, /api/plateforme/**) : jeton de service du client
      # Keycloak gateway-supervision ; sans secret, supervision en mode dégradé (santé sans
      # détail, configuration et journalisation des services non lues).
      - GIMAC_SUPERVISION_CLIENT_ID=gateway-supervision
      - GIMAC_SUPERVISION_CLIENT_SECRET=${GIMAC_SECRET_GATEWAY_SUPERVISION:?à définir dans .env}
    ports: !override
      - ${GIMAC_PORT_GATEWAY:-8080}:8080

  keycloak:
    # Montages fichier par fichier : le realm JHipster généré et le domaine gimac du lot 1.
    volumes: !override
      - ./realm-config/jhipster-realm.json:/opt/keycloak/data/import/jhipster-realm.json:ro
      - ../keycloak/gimac-realm.json:/opt/keycloak/data/import/gimac-realm.json:ro
      - ./realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh:ro
      # Thème GIMAC des pages de connexion et des courriels (D-62) ; en Kubernetes, il est
      # intégré à l'image construite depuis infra/keycloak/Dockerfile.
      - ../keycloak/themes/gimac:/opt/keycloak/themes/gimac:ro
    ports: !override
      - ${GIMAC_PORT_KEYCLOAK:-9080}:9080
      - ${GIMAC_PORT_KEYCLOAK_TLS:-9443}:9443
    # Le démarrage de Keycloak dépasse les 100 s tolérées par la configuration générée.
    healthcheck:
      start_period: 120s
      retries: 60
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=gimac-admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${GIMAC_KEYCLOAK_ADMIN_PASSWORD:?à définir dans .env}
      # Valeurs substituées dans gimac-realm.json à l'import (aucun secret dans le dépôt).
      - GIMAC_MOT_DE_PASSE_TEST=${GIMAC_MOT_DE_PASSE_TEST:?à définir dans .env}
      - GIMAC_SECRET_TESTER_CLI=${GIMAC_SECRET_TESTER_CLI:?à définir dans .env}
      - GIMAC_SECRET_HOMOLOGATION_SERVICE=${GIMAC_SECRET_HOMOLOGATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_CERTIFICATION_SERVICE=${GIMAC_SECRET_CERTIFICATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_PARTICIPANT_SERVICE=${GIMAC_SECRET_PARTICIPANT_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_IAM_SERVICE=${GIMAC_SECRET_IAM_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_GATEWAY_SUPERVISION=${GIMAC_SECRET_GATEWAY_SUPERVISION:?à définir dans .env}
      - GIMAC_SECRET_COLLABORATION_SERVICE=${GIMAC_SECRET_COLLABORATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_INTERNAL=${GIMAC_SECRET_INTERNAL:?à définir dans .env}

  prometheus:
    ports: !override
      - 127.0.0.1:${GIMAC_PORT_PROMETHEUS:-9090}:9090

  # ------------------------------------------------ État des serveurs (D-61)
  # Hôte : CPU, mémoire, disques, charge, collectés par Prometheus (job node-exporter) et
  # restitués par la passerelle sur /api/plateforme/serveurs. Aucun port publié.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro

  # Conteneurs : CPU et mémoire par conteneur (job cadvisor). Accès en lecture au démon
  # Docker de l'hôte : service optionnel, activé par COMPOSE_PROFILES=conteneurs.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: [conteneurs]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  alertmanager:
    ports: !override
      - 127.0.0.1:${GIMAC_PORT_ALERTMANAGER:-9093}:9093

  grafana:
    ports: !override
      - 127.0.0.1:${GIMAC_PORT_GRAFANA:-3000}:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GIMAC_GRAFANA_ADMIN_PASSWORD:?à définir dans .env}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./observabilite/grafana/provisioning:/etc/grafana/provisioning:ro

  # ------------------------------------------------ Couches de présentation (D-46, D-51)
  # Images construites depuis ../../frontend (Dockerfile commun, argument APPLICATION ; SERVICES=http :
  # services réels de la passerelle), servies par nginx sans privilège ; /api, /bff, /oauth2, /login et
  # /logout relayés vers la passerelle (BFF), flux SSE sans mise en tampon. Chaque couche est servie à la
  # racine de son port et route elle-même /des, /portail ou /console (et /connexion).
  frontend-departement:
    # Application du département
    image: frontend-departement
    build:
      context: ../../frontend
      args:
        APPLICATION: departement
        SERVICES: http
    environment:
      GIMAC_PASSERELLE: http://gateway:8080
    ports:
      - 127.0.0.1:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/sante']
      <<: *sante

  frontend-portail:
    # Portail des participants (DMZ)
    image: frontend-portail
    build:
      context: ../../frontend
      args:
        APPLICATION: portail
        SERVICES: http
    environment:
      GIMAC_PASSERELLE: http://gateway:8080
    ports:
      - 127.0.0.1:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/sante']
      <<: *sante

  frontend-console:
    # Console d'administration et d'audit (hors bande)
    image: frontend-console
    build:
      context: ../../frontend
      args:
        APPLICATION: console
        SERVICES: http
    environment:
      GIMAC_PASSERELLE: http://gateway:8080
    ports:
      - 127.0.0.1:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/sante']
      <<: *sante

  # ------------------------------------------------ Registre des schémas (SOC-03, D-37)
  registre-schemas:
    image: apicurio/apicurio-registry:3.3.3
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
    ports:
      - 127.0.0.1:8880:8080

  # ------------------------------------------------ Dépôt objet WORM (SOC-10, RG-04, RG-16, D-50)
  # Ceph RGW (passerelle S3 de Ceph, verrouillage d'objets en mode conformité),
  # en mono-nœud de développement sur l'image officielle de Ceph.
  stockage-objet:
    image: quay.io/ceph/ceph:v20.2.4
    entrypoint: ['/ceph-mononoeud.sh']
    environment:
      GIMAC_S3_CLE_ACCES: ${GIMAC_S3_CLE_ACCES:?à définir dans .env}
      GIMAC_S3_CLE_SECRETE: ${GIMAC_S3_CLE_SECRETE:?à définir dans .env}
    volumes:
      - ./stockage-objet/ceph-mononoeud.sh:/ceph-mononoeud.sh:ro
      - stockage_objet_data:/var/lib/ceph
    ports:
      - 127.0.0.1:${GIMAC_PORT_S3:-7480}:7480
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7480']
      <<: *sante
      start_period: 60s

  stockage-objet-init:
    image: amazon/aws-cli:2.37.5
    depends_on:
      stockage-objet:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${GIMAC_S3_CLE_ACCES}
      AWS_SECRET_ACCESS_KEY: ${GIMAC_S3_CLE_SECRETE}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./stockage-objet/init-compartiments.sh:/init-compartiments.sh:ro
    entrypoint: ['/bin/sh', '/init-compartiments.sh']
    restart: 'no'

  # ------------------------------------------------ Coffre de clés (SOC-06, D-44)
  openbao:
    image: openbao/openbao:2.7.0
    command: ['server', '-dev', '-dev-listen-address=0.0.0.0:8200']
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${GIMAC_OPENBAO_TOKEN:?à définir dans .env}
    cap_add: [IPC_LOCK]
    ports:
      - 127.0.0.1:8200:8200

  # ------------------------------------------------ Politiques d'accès (IAM-19, RG-24)
  opa:
    image: openpolicyagent/opa:1.21.0-static
    command: ['run', '--server', '--addr=0.0.0.0:8181', '--ignore=*_test.rego', '/politiques']
    volumes:
      - ./opa/politiques:/politiques:ro
    ports:
      - 127.0.0.1:8181:8181

  # ------------------------------------------------ Simulacres des applications tierces (SOC-13)
  simulateur-certification:
    image: wiremock/wiremock:3.13.2-alpine
    command: ['--global-response-templating', '--disable-banner']
    volumes:
      - ./simulacres/simulateur:/home/wiremock:ro
    ports:
      - 127.0.0.1:8190:8080

  gestion-changements:
    image: wiremock/wiremock:3.13.2-alpine
    command: ['--global-response-templating', '--disable-banner']
    volumes:
      - ./simulacres/changements:/home/wiremock:ro
    ports:
      - 127.0.0.1:8191:8080

  autorite-horodatage:
    image: wiremock/wiremock:3.13.2-alpine
    command: ['--disable-banner']
    volumes:
      - ./simulacres/horodatage:/home/wiremock:ro
    ports:
      - 127.0.0.1:8192:8080

  messagerie:
    image: axllent/mailpit:v1.31.3
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

  # ------------------------------------------------ Traces et journaux (SOC-08)
  # Les métriques restent collectées par le Prometheus généré par JHipster.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./observabilite/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318

  loki:
    image: grafana/loki:3.7.8
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - 127.0.0.1:${GIMAC_PORT_LOKI:-3100}:3100

  tempo:
    image: grafana/tempo:2.10.8
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observabilite/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - 127.0.0.1:3200:3200

volumes:
  stockage_objet_data: {}
