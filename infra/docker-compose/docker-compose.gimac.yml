# Complément propre au projet GIMAC, fusionné avec docker-compose.yml.
#
# docker-compose.yml est produit par « jhipster docker-compose » (configuration
# dans .yo-rc.json) et ne doit pas être modifié à la main : on le régénère.
# Ce fichier ajoute seulement ce que JHipster ne génère pas (D-45, SOC-13) et
# surcharge ce que le référentiel impose (D-25 : Valkey, D-44 : aucun secret par défaut,
# D-50 : Ceph RGW comme dépôt objet WORM).
#
# Lancement : ./gimac-dev.sh demarrer   (fusionne les deux fichiers)
# Secrets : fichier .env local, créé par gimac-dev.sh, jamais versionné (BNF-07).

x-valkey: &valkey
  # D-25 : Valkey remplace Redis, dont la licence n'est plus libre.
  image: valkey/valkey:9.0.6-alpine

# Domaine Keycloak du lot 1 (PI-GIMAC-01) : jetons émis par le domaine « gimac ».
x-emetteur-gimac: &emetteur-gimac
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI: http://keycloak:9080/realms/gimac
  # Secret du client de service « internal » des services générés (aucun secret dans le dépôt).
  GIMAC_SECRET_INTERNAL: ${GIMAC_SECRET_INTERNAL:?à définir dans .env}

# Les 14 services générés ne dépendent pas de Kafka dans docker-compose.yml : sans
# Kafka, leurs liaisons Spring Cloud Stream échouent et leur sonde reste en échec.
# Démarrés ensemble, ils dépassent aussi les 200 s tolérées par la sonde générée.
x-application: &application
  environment:
    <<: *emetteur-gimac
  depends_on:
    kafka:
      condition: service_started
    # Sujets du lot 1 créés avec leurs partitions avant tout producteur (sinon auto-créés à 1 partition).
    kafka-sujets-init:
      condition: service_completed_successfully
  healthcheck:
    start_period: 240s
    retries: 60

x-sante: &sante
  interval: 5s
  timeout: 5s
  retries: 30
  start_period: 10s

services:
  # ------------------------------------------------ Surcharges des services générés
  # Annuaire réel (D-62) : MS-IAM administre le domaine gimac par l'API d'administration de
  # Keycloak avec son compte de service ; vérifie les assertions FIDO2 des couches (IAM-07).
  iam:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: iam-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_IAM_SERVICE:?à définir dans .env}
      GIMAC_KEYCLOAK_URL: http://keycloak:9080
      GIMAC_WEBAUTHN_RP_ID: ${GIMAC_WEBAUTHN_RP_ID:-localhost}
      GIMAC_WEBAUTHN_ORIGINES: ${GIMAC_WEBAUTHN_ORIGINES:-http://localhost:4200,http://localhost:4201,http://localhost:4202}
      # Connexion sur la plateforme (D-65) : vérification du mot de passe actuel (client gimac-connexion),
      # chiffrement au repos des secrets d'enrôlement TOTP et du mot de passe SMTP, liens des courriels.
      GIMAC_SECRET_CONNEXION: ${GIMAC_SECRET_CONNEXION:?à définir dans .env}
      GIMAC_IAM_CLE_CHIFFREMENT: ${GIMAC_IAM_CLE_CHIFFREMENT:?à définir dans .env}
      GIMAC_URL_DES: ${GIMAC_URL_DES:-http://localhost:4200}
      GIMAC_URL_PORTAIL: ${GIMAC_URL_PORTAIL:-http://localhost:4201}
      GIMAC_URL_CONSOLE: ${GIMAC_URL_CONSOLE:-http://localhost:4202}
  audit: *application
  # Dépôt direct de la tranche DDRM : adaptateur S3 réel vers Ceph RGW (D-50), démarré
  # après la création des compartiments WORM (le service vérifie le verrouillage d'objets).
  document:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_S3_POINT_ACCES: http://stockage-objet:7480
      GIMAC_S3_CLE_ACCES: ${GIMAC_S3_CLE_ACCES:?à définir dans .env}
      GIMAC_S3_CLE_SECRETE: ${GIMAC_S3_CLE_SECRETE:?à définir dans .env}
      # Dépôts fragmentés en cours (D-74) : compartiment sans verrouillage, créé par stockage-objet-init.
      GIMAC_S3_COMPARTIMENT_DEPOTS: gimac-depots
      # Aperçu des documents bureautiques (D-83) : moteur de conversion du réseau interne « conversion ».
      GIMAC_APERCU_URL: http://conversion-documents:3000
    depends_on:
      kafka:
        condition: service_started
      kafka-sujets-init:
        condition: service_completed_successfully
      stockage-objet-init:
        condition: service_completed_successfully
    networks:
      - default
      - conversion
  # Notifications de la plateforme (D-80) : noms de l'annuaire de MS-IAM et nom des groupes de MS-COLLABORATION
  # par le jeton du client notification-service (INTERNAL_IAM_READ, INTERNAL_COLLABORATION_READ).
  notification:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: notification-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_NOTIFICATION_SERVICE:?à définir dans .env}
      GIMAC_SERVICES_IAM_URL: http://iam:8081
      GIMAC_SERVICES_COLLABORATION_URL: http://collaboration:8093
  participant:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: participant-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_PARTICIPANT_SERVICE:?à définir dans .env}
  homologation:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: homologation-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_HOMOLOGATION_SERVICE:?à définir dans .env}
      # Contrat v1 de SBX-LECTURE sur son alias du réseau partagé avec la Sandbox (D-122).
      GIMAC_SBX_LECTURE_URL: http://sbx-lecture:8111
  certification:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: certification-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_CERTIFICATION_SERVICE:?à définir dans .env}
  incident: *application
  # Supervision et astreintes (D-114, docs/lot1/astreintes-monitoring.md) : opérateurs qualifiés, absences validées et
  # vérification FIDO2 (MS-IAM), dépôt des rapports de quart scellés (MS-DOCUMENT), par le jeton du client
  # monitoring-service ; adaptateurs « real » du profil prod (application-prod.yml).
  monitoring:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: monitoring-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_MONITORING_SERVICE:?à définir dans .env}
      GIMAC_SERVICES_IAM_URL: http://iam:8081
      GIMAC_SERVICES_DOCUMENT_URL: http://document:8083
  rapprochement: *application
  # Mon activité (D-76) : organisation de MS-IAM et documents des rapports de MS-DOCUMENT par le jeton
  # du client pilotage-service (INTERNAL_IAM_READ, INTERNAL_DOCUMENT_READ). Processus d'unité (D-87) : profil prod
  # (docker-compose.yml), donc adaptateurs organisation, documents et reauthentification « real » (application-prod.yml) :
  # vérification FIDO2 SIGNATURE_PROCESSUS par MS-IAM, livrables PROCESSUS_UNITE relus dans MS-DOCUMENT.
  pilotage:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: pilotage-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_PILOTAGE_SERVICE:?à définir dans .env}
      GIMAC_SERVICES_IAM_URL: http://iam:8081
      GIMAC_SERVICES_DOCUMENT_URL: http://document:8083
  reporting: *application
  # Messagerie de travail (D-64) : annuaire de MS-IAM et dépôt de MS-DOCUMENT par le jeton du client
  # collaboration-service ; clé de chiffrement au repos des messages hors base (.env).
  collaboration:
    <<: *application
    environment:
      <<: *emetteur-gimac
      GIMAC_SERVICE_CLIENT_ID: collaboration-service
      GIMAC_SERVICE_CLIENT_SECRET: ${GIMAC_SECRET_COLLABORATION_SERVICE:?à définir dans .env}
      GIMAC_MESSAGERIE_CLE: ${GIMAC_MESSAGERIE_CLE:?à définir dans .env}
      GIMAC_SERVICES_IAM_URL: http://iam:8081
      GIMAC_SERVICES_DOCUMENT_URL: http://document:8083
  gateway-valkey:
    <<: *valkey
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  iam-redis: *valkey
  document-redis: *valkey
  notification-redis: *valkey
  participant-redis: *valkey
  incident-redis: *valkey
  monitoring-redis: *valkey
  rapprochement-redis: *valkey
  pilotage-redis: *valkey
  reporting-redis: *valkey
  collaboration-redis: *valkey

  # Ports de l'hôte réglables dans .env (!override remplace la liste générée),
  # pour cohabiter avec d'autres projets du poste. Défauts : ports de JHipster.
  gateway:
    <<: *application
    depends_on:
      kafka:
        condition: service_started
      kafka-sujets-init:
        condition: service_completed_successfully
      gateway-valkey:
        condition: service_healthy
    # Limitation de débit et révocations sur Valkey (GW-07, SOC-11, D-25) ; la dépendance
    # Redis réactive active aussi un indicateur de santé Redis.
    environment:
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=http://keycloak:9080/realms/gimac
      - SPRING_DATA_REDIS_HOST=gateway-valkey
      - SPRING_DATA_REDIS_PORT=6379
      # Supervision de la plateforme (D-61, /api/plateforme/**) : jeton de service du client
      # Keycloak gateway-supervision ; sans secret, supervision en mode dégradé (santé sans
      # détail, configuration et journalisation des services non lues).
      - GIMAC_SUPERVISION_CLIENT_ID=gateway-supervision
      - GIMAC_SUPERVISION_CLIENT_SECRET=${GIMAC_SECRET_GATEWAY_SUPERVISION:?à définir dans .env}
      # Connexion sur la plateforme (D-65, docs/lot1/connexion.md §2) : octroi direct de serveur à serveur
      # sur les clients confidentiels gimac-connexion (mot de passe seul, acr 1) et web_app (mot de passe
      # et code TOTP, acr 2) ; jeton de service gateway-service vers MS-IAM (INTERNAL_IAM_READ).
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID=web_app
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET=${GIMAC_SECRET_WEB_APP:?à définir dans .env}
      - GIMAC_CONNEXION_CLIENT_ID=gimac-connexion
      - GIMAC_SECRET_CONNEXION=${GIMAC_SECRET_CONNEXION:?à définir dans .env}
      - GIMAC_SERVICE_CLIENT_ID=gateway-service
      - GIMAC_SERVICE_CLIENT_SECRET=${GIMAC_SECRET_GATEWAY_SERVICE:?à définir dans .env}
      # Témoin de session Secure (les navigateurs l'acceptent sur http://localhost) ; false seulement
      # pour un poste servi en http sous un autre nom d'hôte.
      - GIMAC_SESSION_TEMOIN_SECURISE=${GIMAC_SESSION_TEMOIN_SECURISE:-true}
      # Journal d'audit de la connexion (gateway.login-succeeded.v1, gateway.login-failed.v1) publié sur
      # le sujet gateway.security.events, scellé par MS-AUDIT.
      - GIMAC_PASSERELLE_JOURNAL_DECISIONS_ACTIF=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Jeton interne réduit de la sandbox (D-134) : émetteur, clé et /api/internal/jwks actifs, sans le mode jeton
      # fantôme des routes de la plateforme ; le jeton réduit devient obligatoire. Clé RSA persistante générée hors
      # du dépôt par scripts/generer-cle-passerelle.sh (gimac-dev.sh, mettre-a-jour.sh, deployer-serveur.sh).
      - GIMAC_SECURITE_JETON_INTERNE_ACTIF=true
      - GIMAC_CLE_SIGNATURE_CHEMIN=/run/gimac/cle-signature-passerelle.pem
      - GIMAC_CLE_SIGNATURE_EPHEMERE=false
    volumes:
      - ${GIMAC_CLE_SIGNATURE_PASSERELLE:-./secrets/cle-signature-passerelle.pem}:/run/gimac/cle-signature-passerelle.pem:ro
    ports: !override
      - ${GIMAC_PORT_GATEWAY:-8080}:8080

  keycloak:
    # Montages fichier par fichier : le realm JHipster généré et le domaine gimac du lot 1.
    volumes: !override
      - ./realm-config/jhipster-realm.json:/opt/keycloak/data/import/jhipster-realm.json:ro
      - ../keycloak/gimac-realm.json:/opt/keycloak/data/import/gimac-realm.json:ro
      - ./realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh:ro
      # Thème GIMAC des pages de connexion et des courriels (D-62) ; en Kubernetes, il est
      # intégré à l'image construite depuis infra/keycloak/Dockerfile.
      - ../keycloak/themes/gimac:/opt/keycloak/themes/gimac:ro
      # Extension gimac-totp (D-65) : enregistrement du code TOTP configuré sur la plateforme ; construite
      # par `mvn -f ../keycloak/extensions/gimac-totp package` (gimac-dev.sh), intégrée à l'image en Kubernetes.
      - ../keycloak/extensions/gimac-totp/target/gimac-totp.jar:/opt/keycloak/providers/gimac-totp.jar:ro
    ports: !override
      - ${GIMAC_PORT_KEYCLOAK:-9080}:9080
      - ${GIMAC_PORT_KEYCLOAK_TLS:-9443}:9443
    # Le démarrage de Keycloak dépasse les 100 s tolérées par la configuration générée.
    healthcheck:
      start_period: 120s
      retries: 60
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=gimac-admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${GIMAC_KEYCLOAK_ADMIN_PASSWORD:?à définir dans .env}
      # Valeurs substituées dans gimac-realm.json à l'import (aucun secret dans le dépôt).
      - GIMAC_MOT_DE_PASSE_TEST=${GIMAC_MOT_DE_PASSE_TEST:?à définir dans .env}
      - GIMAC_SECRET_TESTER_CLI=${GIMAC_SECRET_TESTER_CLI:?à définir dans .env}
      - GIMAC_SECRET_HOMOLOGATION_SERVICE=${GIMAC_SECRET_HOMOLOGATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_CERTIFICATION_SERVICE=${GIMAC_SECRET_CERTIFICATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_PARTICIPANT_SERVICE=${GIMAC_SECRET_PARTICIPANT_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_IAM_SERVICE=${GIMAC_SECRET_IAM_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_GATEWAY_SUPERVISION=${GIMAC_SECRET_GATEWAY_SUPERVISION:?à définir dans .env}
      # Clients de la connexion sur la plateforme (D-65) : gimac-connexion, web_app, gateway-service.
      - GIMAC_SECRET_CONNEXION=${GIMAC_SECRET_CONNEXION:?à définir dans .env}
      - GIMAC_SECRET_WEB_APP=${GIMAC_SECRET_WEB_APP:?à définir dans .env}
      - GIMAC_SECRET_GATEWAY_SERVICE=${GIMAC_SECRET_GATEWAY_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_COLLABORATION_SERVICE=${GIMAC_SECRET_COLLABORATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_PILOTAGE_SERVICE=${GIMAC_SECRET_PILOTAGE_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_NOTIFICATION_SERVICE=${GIMAC_SECRET_NOTIFICATION_SERVICE:?à définir dans .env}
      # Supervision et astreintes (D-114) : client monitoring-service.
      - GIMAC_SECRET_MONITORING_SERVICE=${GIMAC_SECRET_MONITORING_SERVICE:?à définir dans .env}
      # Reprise de l'existant (D-107) : client reprise-service de l'outil infra/reprise/importer-reprise.py.
      - GIMAC_SECRET_REPRISE_SERVICE=${GIMAC_SECRET_REPRISE_SERVICE:?à définir dans .env}
      # Sandbox GIMAC (D-119, US-EXI-05) : comptes de service des onze services de la sandbox et de Mifos (clients sbx-*).
      - GIMAC_SECRET_SBX_ESPACE=${GIMAC_SECRET_SBX_ESPACE:?à définir dans .env}
      - GIMAC_SECRET_SBX_RACCORDEMENT=${GIMAC_SECRET_SBX_RACCORDEMENT:?à définir dans .env}
      - GIMAC_SECRET_SBX_REFERENTIEL=${GIMAC_SECRET_SBX_REFERENTIEL:?à définir dans .env}
      - GIMAC_SECRET_SBX_DONNEES=${GIMAC_SECRET_SBX_DONNEES:?à définir dans .env}
      - GIMAC_SECRET_SBX_SIMULATION=${GIMAC_SECRET_SBX_SIMULATION:?à définir dans .env}
      - GIMAC_SECRET_SBX_MOBILE=${GIMAC_SECRET_SBX_MOBILE:?à définir dans .env}
      - GIMAC_SECRET_SBX_ISO20022=${GIMAC_SECRET_SBX_ISO20022:?à définir dans .env}
      - GIMAC_SECRET_SBX_CARTE=${GIMAC_SECRET_SBX_CARTE:?à définir dans .env}
      - GIMAC_SECRET_SBX_CAMPAGNE=${GIMAC_SECRET_SBX_CAMPAGNE:?à définir dans .env}
      - GIMAC_SECRET_SBX_TRACE=${GIMAC_SECRET_SBX_TRACE:?à définir dans .env}
      - GIMAC_SECRET_SBX_LECTURE=${GIMAC_SECRET_SBX_LECTURE:?à définir dans .env}
      - GIMAC_SECRET_SBX_MIFOS=${GIMAC_SECRET_SBX_MIFOS:?à définir dans .env}
      # Compte de service d'exploitation (D-122) : republication des états des liaisons pour la sandbox.
      - GIMAC_SECRET_EXPLOITATION_SERVICE=${GIMAC_SECRET_EXPLOITATION_SERVICE:?à définir dans .env}
      - GIMAC_SECRET_INTERNAL=${GIMAC_SECRET_INTERNAL:?à définir dans .env}

  prometheus:
    ports: !override
      - 127.0.0.1:${GIMAC_PORT_PROMETHEUS:-9090}:9090
    # Historique des graphiques de la supervision (/api/plateforme/series, périodes de 1 h à 7 jours) :
    # rétention explicite de 15 jours, au-delà de la plus longue période affichée, plafonnée à 3 Go
    # (7,3 Go constatés sur le serveur 214 le 12/10/2026, disque système saturé).
    command: !override
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=3GB"

  # ------------------------------------------------ État des serveurs (D-61)
  # Hôte : CPU, mémoire, disques, charge, collectés par Prometheus (job node-exporter) et
  # restitués par la passerelle sur /api/plateforme/serveurs. Aucun port publié.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro

  # Conteneurs : CPU et mémoire par conteneur (job cadvisor). Accès en lecture au démon
  # Docker de l'hôte : service optionnel, activé par COMPOSE_PROFILES=conteneurs.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: [conteneurs]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  alertmanager:
    ports: !override
      - 127.0.0.1:${GIMAC_PORT_ALERTMANAGER:-9093}:9093

  grafana:
    ports: !override
      - 127.0.0.1:${GIMAC_PORT_GRAFANA:-3000}:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GIMAC_GRAFANA_ADMIN_PASSWORD:?à définir dans .env}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./observabilite/grafana/provisioning:/etc/grafana/provisioning:ro

  # ------------------------------------------------ Couches de présentation (D-46, D-51)
  # Images construites depuis ../../frontend (Dockerfile commun, argument APPLICATION ; SERVICES=http :
  # services réels de la passerelle), servies par nginx sans privilège ; /api, /bff, /oauth2, /login et
  # /logout relayés vers la passerelle (BFF), flux SSE sans mise en tampon. Chaque couche est servie à la
  # racine de son port et route elle-même /des, /portail ou /console (et /connexion).
  frontend-departement:
    # Application du département
    image: frontend-departement
    build:
      context: ../../frontend
      args:
        APPLICATION: departement
        SERVICES: http
        # Liens « Administration » vers la console (D-62) et aiguillage (D-79) : adresses publiées sur l'hôte.
        URL_DES: http://localhost:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        URL_PORTAIL: http://localhost:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}
        URL_CONSOLE: http://localhost:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}
        # Ports de l'accès direct : liens calculés sur l'hôte de la page quand elle n'est pas ouverte
        # sous l'une des adresses ci-dessus (accès par l'adresse IP en publication mixte, D-75).
        PORT_DES: ${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        PORT_PORTAIL: ${GIMAC_PORT_FRONTEND_PORTAIL:-4201}
        PORT_CONSOLE: ${GIMAC_PORT_FRONTEND_CONSOLE:-4202}
    environment:
      GIMAC_PASSERELLE: http://gateway:8080
    # nginx résout l'amont statique au démarrage : la passerelle doit déjà être enregistrée et saine.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/sante']
      <<: *sante

  frontend-portail:
    # Portail des participants (DMZ)
    image: frontend-portail
    build:
      context: ../../frontend
      args:
        APPLICATION: portail
        SERVICES: http
        # Aiguillage des comptes entre les trois applications (D-79) : adresses publiées sur l'hôte.
        URL_DES: http://localhost:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        URL_PORTAIL: http://localhost:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}
        URL_CONSOLE: http://localhost:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}
        # Ports de l'accès direct : liens calculés sur l'hôte de la page quand elle n'est pas ouverte
        # sous l'une des adresses ci-dessus (accès par l'adresse IP en publication mixte, D-75).
        PORT_DES: ${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        PORT_PORTAIL: ${GIMAC_PORT_FRONTEND_PORTAIL:-4201}
        PORT_CONSOLE: ${GIMAC_PORT_FRONTEND_CONSOLE:-4202}
    environment:
      GIMAC_PASSERELLE: http://gateway:8080
    # nginx résout l'amont statique au démarrage : la passerelle doit déjà être enregistrée et saine.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/sante']
      <<: *sante

  frontend-console:
    # Console d'administration et d'audit (hors bande)
    image: frontend-console
    build:
      context: ../../frontend
      args:
        APPLICATION: console
        SERVICES: http
        # Retour au département (D-69) et aiguillage (D-79), publiés sur l'hôte.
        URL_DEPARTEMENT: http://localhost:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        URL_DES: http://localhost:${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        URL_PORTAIL: http://localhost:${GIMAC_PORT_FRONTEND_PORTAIL:-4201}
        URL_CONSOLE: http://localhost:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}
        # Ports de l'accès direct : liens calculés sur l'hôte de la page quand elle n'est pas ouverte
        # sous l'une des adresses ci-dessus (accès par l'adresse IP en publication mixte, D-75).
        PORT_DES: ${GIMAC_PORT_FRONTEND_DEPARTEMENT:-4200}
        PORT_PORTAIL: ${GIMAC_PORT_FRONTEND_PORTAIL:-4201}
        PORT_CONSOLE: ${GIMAC_PORT_FRONTEND_CONSOLE:-4202}
    environment:
      GIMAC_PASSERELLE: http://gateway:8080
    # nginx résout l'amont statique au démarrage : la passerelle doit déjà être enregistrée et saine.
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - 127.0.0.1:${GIMAC_PORT_FRONTEND_CONSOLE:-4202}:8080
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/sante']
      <<: *sante

  # ------------------------------------------------ Courtier Kafka (mono-nœud de développement)
  # Le Compose généré ne règle pas la réplication des sujets internes : l'image Kafka, dès qu'elle
  # reçoit des variables KAFKA_*, n'applique que celles-ci et garde le facteur 3 par défaut. Sur un
  # seul courtier, __consumer_offsets n'est alors jamais créé : aucun coordinateur de groupe, aucun
  # consommateur abonné ne reçoit de partition (canal poussé de la passerelle muet, liaisons Spring
  # Cloud Stream sans message). Vérifié par CourtierPlateformeIT (ms-gateway).
  kafka:
    environment:
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

  # Sujets du lot 1 (infra/kafka/creer-sujets-lot1.sh, PI-GIMAC-01 §0.5) : 6 partitions, rétention
  # 30 jours, files .dlq ; réplication 1. L'image native du courtier n'a pas les outils : image
  # officielle complète. Attend le courtier, ne recrée rien (idempotent).
  kafka-sujets-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      REPLICATION: 1
      KAFKA_TOPICS: /opt/kafka/bin/kafka-topics.sh
    volumes:
      - ../kafka/creer-sujets-lot1.sh:/creer-sujets-lot1.sh:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        for i in $$(seq 60); do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1 && exec /bin/bash /creer-sujets-lot1.sh
          echo "courtier kafka:9092 indisponible ($$i/60)"; sleep 2
        done
        exit 1
    restart: 'no'

  # ------------------------------------------------ Registre des schémas (SOC-03, D-37)
  registre-schemas:
    image: apicurio/apicurio-registry:3.3.3
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: h2
    ports:
      - 127.0.0.1:8880:8080

  # ------------------------------------------------ Dépôt objet WORM (SOC-10, RG-04, RG-16, D-50)
  # Ceph RGW (passerelle S3 de Ceph, verrouillage d'objets en mode conformité),
  # en mono-nœud de développement sur l'image officielle de Ceph.
  stockage-objet:
    image: quay.io/ceph/ceph:v20.2.4
    entrypoint: ['/ceph-mononoeud.sh']
    environment:
      GIMAC_S3_CLE_ACCES: ${GIMAC_S3_CLE_ACCES:?à définir dans .env}
      GIMAC_S3_CLE_SECRETE: ${GIMAC_S3_CLE_SECRETE:?à définir dans .env}
    volumes:
      - ./stockage-objet/ceph-mononoeud.sh:/ceph-mononoeud.sh:ro
      - stockage_objet_data:/var/lib/ceph
    ports:
      - 127.0.0.1:${GIMAC_PORT_S3:-7480}:7480
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:7480']
      <<: *sante
      start_period: 60s

  stockage-objet-init:
    image: amazon/aws-cli:2.37.5
    depends_on:
      stockage-objet:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${GIMAC_S3_CLE_ACCES}
      AWS_SECRET_ACCESS_KEY: ${GIMAC_S3_CLE_SECRETE}
      AWS_DEFAULT_REGION: us-east-1
      GIMAC_S3_COMPARTIMENT_DEPOTS: gimac-depots
    volumes:
      - ./stockage-objet/init-compartiments.sh:/init-compartiments.sh:ro
    entrypoint: ['/bin/sh', '/init-compartiments.sh']
    restart: 'no'

  # ------------------------------------------------ Coffre de clés (SOC-06, D-44)
  openbao:
    image: openbao/openbao:2.7.0
    command: ['server', '-dev', '-dev-listen-address=0.0.0.0:8200']
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${GIMAC_OPENBAO_TOKEN:?à définir dans .env}
    cap_add: [IPC_LOCK]
    ports:
      - 127.0.0.1:8200:8200

  # ------------------------------------------------ Aperçu des documents bureautiques (D-83)
  # Gotenberg 8 (LibreOffice sans interface), docs/lot1/apercu-bureautique.md : seul MS-DOCUMENT le joint, par
  # le réseau interne « conversion » (aucun port publié, aucun accès sortant). Routes des moteurs PDF, webhooks,
  # téléchargement d'URL et métriques désactivés ; délai de conversion 60 s, corps de 21 Mo au plus, file d'attente
  # bornée (au-delà, 429 : MS-DOCUMENT répond DOC_APERCU_INDISPONIBLE). Les macros ne sont jamais exécutées (réglage
  # de LibreOffice dans l'image). Chromium (D-102, organigramme en PDF, docs/lot1/organigramme.md §4) : documents
  # composés par MS-IAM et contrôlés par MS-DOCUMENT, JavaScript désactivé, seules les adresses de ses fichiers
  # temporaires admises (toute autre adresse, privée ou publique, refusée). Mémoire bornée à 1,5 Go.
  conversion-documents:
    image: gotenberg/gotenberg:8.37.0
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --chromium-deny-private-ips=true
      - --chromium-deny-public-ips=true
      - --chromium-max-queue-size=10
      - --webhook-disable=true
      - --api-timeout=60s
      - --api-disable-download-from=true
      - --api-body-limit=21MB
      - --pdfengines-disable-routes=true
      - --prometheus-disable-collect=true
      - --libreoffice-auto-start=true
      - --libreoffice-max-queue-size=20
    mem_limit: 1536m
    # Système de fichiers en lecture seule : LibreOffice n'écrit que dans /tmp et son profil, en mémoire.
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001
      - /home/gotenberg:uid=1001,gid=1001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - conversion
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/health']
      <<: *sante
      start_period: 30s

  # ------------------------------------------------ Politiques d'accès (IAM-19, RG-24)
  opa:
    image: openpolicyagent/opa:1.21.0-static
    command: ['run', '--server', '--addr=0.0.0.0:8181', '--ignore=*_test.rego', '/politiques']
    volumes:
      - ./opa/politiques:/politiques:ro
    ports:
      - 127.0.0.1:8181:8181

  # ------------------------------------------------ Simulacres des applications tierces (SOC-13)
  simulateur-certification:
    image: wiremock/wiremock:3.13.2-alpine
    command: ['--global-response-templating', '--disable-banner']
    volumes:
      - ./simulacres/simulateur:/home/wiremock:ro
    ports:
      - 127.0.0.1:8190:8080

  gestion-changements:
    image: wiremock/wiremock:3.13.2-alpine
    command: ['--global-response-templating', '--disable-banner']
    volumes:
      - ./simulacres/changements:/home/wiremock:ro
    ports:
      - 127.0.0.1:8191:8080

  autorite-horodatage:
    image: wiremock/wiremock:3.13.2-alpine
    command: ['--disable-banner']
    volumes:
      - ./simulacres/horodatage:/home/wiremock:ro
    ports:
      - 127.0.0.1:8192:8080

  messagerie:
    image: axllent/mailpit:v1.31.3
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025

  # ------------------------------------------------ Traces et journaux (SOC-08)
  # Les métriques restent collectées par le Prometheus généré par JHipster.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./observabilite/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318

  loki:
    image: grafana/loki:3.7.8
    # Conservation d'un jour (D-111) : observabilite/loki.yaml.
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ./observabilite/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - 127.0.0.1:${GIMAC_PORT_LOKI:-3100}:3100

  tempo:
    image: grafana/tempo:2.10.8
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./observabilite/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - 127.0.0.1:3200:3200

networks:
  # Réseau interne de l'aperçu bureautique (D-83) : MS-DOCUMENT et le moteur de conversion seulement, sans
  # accès extérieur.
  conversion:
    internal: true

volumes:
  stockage_objet_data: {}
