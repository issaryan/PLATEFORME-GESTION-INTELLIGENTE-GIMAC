# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

---
# ---------------------------------------------------------------------------
# Lot 1 (PI-GIMAC-01 §0.4, §0.7) : outbox, file de rebut et adaptateurs.
# ---------------------------------------------------------------------------
spring:
  security:
    oauth2:
      client:
        registration:
          # Jeton de service (PI §0.7) : client Keycloak homologation-service, secret fourni par l'environnement.
          service-token:
            provider: oidc
            client-id: ${GIMAC_SERVICE_CLIENT_ID:homologation-service}
            client-secret: ${GIMAC_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid
  kafka:
    # Producteur de l'outbox : même courtier que le binder Spring Cloud Stream.
    bootstrap-servers: ${spring.cloud.stream.kafka.binder.brokers:localhost:9092}
    producer:
      # Explicites : le liant Spring Cloud Stream impose sinon ByteArraySerializer
      # par défaut, et le relais de l'outbox (clés et enveloppes String) échoue.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    # Consommateurs des événements de MS-CERTIFICATION (@KafkaListener) : chaînes, lecture depuis le
    # début d'un sujet pour un nouveau groupe (aucun événement perdu au premier démarrage).
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
  servlet:
    multipart:
      # Livrables du portail (POST /api/v1/portail/operations/{id}/livrable), transmis à MS-DOCUMENT.
      max-file-size: 20MB
      max-request-size: 21MB
gimac:
  outbox:
    delay: 500
  # Sélection des adaptateurs, un port à la fois (PI §0.8) : real | stub.
  adapters:
    participant-reader: stub
    # Annuaire des collaborateurs de MS-IAM (habilitation du conducteur de projet, D-58).
    collaborator-reader: stub
    document-deposit: stub
    reauthentication: stub
    simulator-reader: stub
    timestamp-authority: stub
    key-vault-signing: stub
    change-record-reader: stub
    # Tâches de MS-PILOTAGE (D-77) : demandes relayées avec réessai.
    pilotage-tasks: stub
    # Contrat de lecture v1 de SBX-LECTURE (US-EXI-14, D-122), remplace simulator-reader.
    sbx-lecture: stub
  # Services joints par les adaptateurs réels (surchargés en prod).
  services:
    participant:
      url: http://localhost:8085
    document:
      url: http://localhost:8083
    iam:
      url: http://localhost:8081
    audit:
      url: http://localhost:8082
    pilotage:
      url: http://localhost:8091
    # SBX-LECTURE par la passerelle interne de service (mTLS, jeton lié au certificat, US-EXI-14).
    sbx-lecture:
      url: http://localhost:8180
  # Relais des demandes de tâches vers MS-PILOTAGE (D-77, docs/lot1/modelisateur-processus.md §5).
  taches:
    delai: 2000
    delai-initial: 10000
  homologation:
    referentiel:
      # Gestes de certification attendus à la publication d'une version (D-93 §4, effet-reel-referentiels.md §10.5) :
      # pour chaque jalon porté par la version, déclencheurs (événements de MS-CERTIFICATION) qu'au moins une opération
      # doit porter, sinon anomalie GESTE_CERTIFICATION_ABSENT (409 HOM_REFERENTIAL_GRAPH_INVALID). « avec-attestations »
      # s'ajoute quand le modèle du type de projet exige des attestations. Liste alignée sur les gestes de MS-CERTIFICATION
      # (GesteCertification, gimac.certification.operations.declencheurs-par-code).
      gestes-certification:
        toujours:
          CERTIFIEE: certification.pv-established.v1,certification.pv-signed.v1
          APPROUVEE_SECURITE: certification.security-approved.v1
        avec-attestations:
          APPROUVEE_SECURITE: certification.change-record-constituted.v1,certification.attestations-archived.v1
    # Compteurs du tableau de bord d'acteur, décrits en données (D-94 §3) : classpath par défaut, ou fichier externe.
    tableau:
      compteurs: classpath:config/tableau-acteur-compteurs.json
    replay: {period: PT5M, failure-threshold: 5, half-open-after: PT2M}
    deadlines: {warning-days: 5, overdue-repeat-days: 7}
  kafka:
    rebut:
      actif: true
      nombre-tentatives: 3
      intervalle-ms: 1000
      # Sujets consommés (événements de MS-CERTIFICATION, docs/lot1/parcours-backend.md §3) : leur file de rebut est créée au démarrage.
      topics-surveilles:
        - certification.proces-verbal
        - certification.approbation
        - iam.account
        - pilotage.task
  consommateurs:
    certification:
      sujets: certification.proces-verbal,certification.approbation
    # Départ d'un compte (MS-IAM, iam.account-administered.v1, DESACTIVATION ou SUPPRESSION) : ses rôles sur les
    # liaisons ouvertes repassent « à affecter » (D-93 §1).
    comptes:
      sujet: iam.account
    # Prise d'une tâche à prendre (MS-PILOTAGE, pilotage.task-taken.v1) : la personne qui prend la tâche
    # <réf.>/AFFECTER/<FONCTION> est affectée à la fonction sur la liaison (D-94, effet-reel-referentiels.md §8.8).
    taches:
      sujet: pilotage.task
    # Fin de campagne de la sandbox (SBX-LECTURE, US-EXI-15) : sujet réservé nommé par le type, comme tous ceux de la sandbox, relecture
    # immédiate de la campagne ; la relève périodique reste la source de vérité.
    fin-campagne-sandbox:
      sujet: sbx-lecture.campaign-published.v1
