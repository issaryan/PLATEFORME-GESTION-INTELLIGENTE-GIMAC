# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
reactive:
  feign:
    circuit:
      breaker:
        enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - gateway
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: gateway
  cloud:
    discovery:
      client:
        simple:
          instances:
            gateway:
              - instanceId: gateway1
                host: localhost
                port: 8080
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay
          httpclient:
            pool:
              max-connections: 1000
          routes:
            - id: gateway_route
              uri: lb://gateway
              predicates:
                - Path=/services/gateway/**
              filters:
                - StripPrefix=2
            # Routes déclarées vers les 13 microservices (GW-19) : JHipster ne les génère pas
            # sans découverte de services, et la résolution lb:// n'y fonctionne pas.
            # Adresses : propriétés gimac.services.* (localhost en DEV, nom du service en prod).
            # Couches de présentation du lot 1 (PI-GIMAC-01 §0.6) : OPA d'abord, sur le chemin
            # d'origine, puis réécriture vers l'API v1 du service. TokenRelay est un filtre par défaut.
            - id: des-homologation
              uri: ${gimac.services.homologation}
              predicates:
                - Path=/bff/des/homologation/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/des/homologation/(?<p>.*), /api/v1/${p}
            - id: portail-homologation
              uri: ${gimac.services.homologation}
              predicates:
                - Path=/bff/portail/homologation/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/portail/homologation/(?<p>.*), /api/v1/portail/${p}
            - id: des-certification
              uri: ${gimac.services.certification}
              predicates:
                - Path=/bff/des/certification/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/des/certification/(?<p>.*), /api/v1/${p}
            - id: portail-certification
              uri: ${gimac.services.certification}
              predicates:
                - Path=/bff/portail/certification/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/portail/certification/(?<p>.*), /api/v1/portail/${p}
            - id: iam_route
              uri: ${gimac.services.iam}
              predicates:
                - Path=/services/iam/**
              filters:
                - StripPrefix=2
            - id: audit_route
              uri: ${gimac.services.audit}
              predicates:
                - Path=/services/audit/**
              filters:
                - StripPrefix=2
            - id: document_route
              uri: ${gimac.services.document}
              predicates:
                - Path=/services/document/**
              filters:
                - StripPrefix=2
            - id: notification_route
              uri: ${gimac.services.notification}
              predicates:
                - Path=/services/notification/**
              filters:
                - StripPrefix=2
            - id: participant_route
              uri: ${gimac.services.participant}
              predicates:
                - Path=/services/participant/**
              filters:
                - StripPrefix=2
            - id: homologation_route
              uri: ${gimac.services.homologation}
              predicates:
                - Path=/services/homologation/**
              filters:
                - StripPrefix=2
            - id: certification_route
              uri: ${gimac.services.certification}
              predicates:
                - Path=/services/certification/**
              filters:
                - StripPrefix=2
            - id: incident_route
              uri: ${gimac.services.incident}
              predicates:
                - Path=/services/incident/**
              filters:
                - StripPrefix=2
            - id: monitoring_route
              uri: ${gimac.services.monitoring}
              predicates:
                - Path=/services/monitoring/**
              filters:
                - StripPrefix=2
            - id: rapprochement_route
              uri: ${gimac.services.rapprochement}
              predicates:
                - Path=/services/rapprochement/**
              filters:
                - StripPrefix=2
            - id: pilotage_route
              uri: ${gimac.services.pilotage}
              predicates:
                - Path=/services/pilotage/**
              filters:
                - StripPrefix=2
            - id: reporting_route
              uri: ${gimac.services.reporting}
              predicates:
                - Path=/services/reporting/**
              filters:
                - StripPrefix=2
            - id: collaboration_route
              uri: ${gimac.services.collaboration}
              predicates:
                - Path=/services/collaboration/**
              filters:
                - StripPrefix=2
          # See alternatives in https://github.com/spring-cloud/spring-cloud-gateway/issues/3818
          trusted-proxies: '.*'
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - kafka
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
      prod:
        - kafka
  jmx:
    enabled: false
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  webflux:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          oidc:
            scope: openid, profile
  task:
    execution:
      thread-name-prefix: gateway-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: gateway-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  mail:
    from: gateway@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Gateway API
    description: Gateway API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    oauth2:
      audience:
        - account
        - api://default


