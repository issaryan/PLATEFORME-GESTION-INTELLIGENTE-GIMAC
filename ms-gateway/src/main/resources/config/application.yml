# application:

# Adresses des microservices joints par la passerelle (GW-19) ; surchargées en prod.
gimac:
  opa:
    url: http://localhost:8181
  services:
    iam: http://localhost:8081
    audit: http://localhost:8082
    document: http://localhost:8083
    notification: http://localhost:8084
    participant: http://localhost:8085
    homologation: http://localhost:8086
    certification: http://localhost:8087
    incident: http://localhost:8088
    monitoring: http://localhost:8089
    rapprochement: http://localhost:8090
    pilotage: http://localhost:8091
    reporting: http://localhost:8092
    collaboration: http://localhost:8093
    # Services de la Sandbox GIMAC (D-120) : ports 8101 à 8111 (SBX-ESPACE 8101).
    sbx-espace: http://localhost:8101
    sbx-raccordement: http://localhost:8102
    sbx-referentiel: http://localhost:8103
    sbx-donnees: http://localhost:8104
    sbx-simulation: http://localhost:8105
    sbx-mobile: http://localhost:8106
    sbx-iso20022: http://localhost:8107
    sbx-carte: http://localhost:8108
    sbx-campagne: http://localhost:8109
    sbx-trace: http://localhost:8110
    sbx-lecture: http://localhost:8111
  # Sandbox GIMAC (D-120, US-EXI-07) : quotas par minute d'un titulaire (institution effective ou compte du GIMAC) sur
  # une route, par couche ; projection des périmètres de SBX-ESPACE (sbx-espace.scope-changed.v1) pour les mandats.
  sandbox:
    quotas:
      portail: 120
      console: 300
      des: 120
    perimetres:
      actif: true
      sujet: sbx-espace.scope-changed.v1
      bootstrap-servers: ${spring.kafka.bootstrap-servers:${spring.cloud.stream.kafka.binder.brokers:localhost:9092}}
  # Canal poussé des couches de présentation (GET /bff/{couche}/live, contrat de messagerie §5) :
  # consommateur Kafka propre à chaque instance, reprise sur les 500 derniers événements (5 min).
  live:
    actif: true
    bootstrap-servers: ${spring.kafka.bootstrap-servers:${spring.cloud.stream.kafka.binder.brokers:localhost:9092}}
    taille-tampon: 500
    duree-tampon: 5m
    battement: 25s
    duree-max-connexion: 30m
    tampon-connexion: 256
    sujets:
      - homologation.referential
      - homologation.liaison
      - homologation.operation
      - homologation.campaign
      - homologation.coverage
      - homologation.notification
      - certification.circuit
      - certification.quitus
      - certification.dossier
      - certification.attestation
      - certification.notification
      - certification.proces-verbal
      - certification.approbation
      - collaboration.message
      # Notifications de la plateforme (D-80) : remises au seul destinataire (data.destinataires).
      - notification.inapp
  # Connexion sur la plateforme (D-65) : MS-IAM (routes internes), délai des appels, limitation.
  connexion:
    iam-url: ${gimac.services.iam}
    delai: 5s
    tentatives-par-minute: 5
  # Fermeture des sessions (D-65 §6) : inactivité maximale 30 min (valeur plafond), durée absolue 10 h.
  session:
    inactivite-max: PT30M
    duree-max: PT10H
    balayage: PT1M
  # Appareils connectés et historique des connexions (docs/lot1/mon-compte.md §3) : rétention de
  # l'historique (table historique_connexion de la base de la passerelle) et période de la purge.
  appareils:
    retention: P90D
    purge: PT1H
  # Supervision de la plateforme (D-61, /api/plateforme/**) : les services supervisés sont la
  # passerelle et ceux de gimac.services ; chaque appel est borné par « delai ».
  supervision:
    passerelle-url: http://localhost:${server.port:8080}
    delai: 2s
    intervalle-flux: 5s
    prometheus-url: http://localhost:9090
    alertmanager-url: http://localhost:9093
    keycloak-sante-url: http://localhost:9990/health/ready
  # Exploitation de l'infrastructure depuis la console (D-78, docs/exploitation/operations-infrastructure.md) :
  # orchestrateur docker (mandataire docker-socket-proxy), kubernetes (compte de service du pod) ou aucun.
  # Variables : GIMAC_ORCHESTRATEUR_TYPE, GIMAC_ORCHESTRATEUR_DOCKER_URL, GIMAC_ORCHESTRATEUR_DOCKER_PROJET,
  # GIMAC_ORCHESTRATEUR_KUBERNETES_ESPACE. Chaque geste est vérifié par MS-IAM (FIDO2, gimac.connexion.iam-url).
  orchestrateur:
    type: aucun
    delai-lecture: 10s
    delai-geste: 90s
    finalite-reauthentification: ADMIN_SENSITIVE
    charges-protegees:
      - gateway
      - frontend-console
      - docker-socket-proxy
      - opa # arrêter OPA bloquerait toutes les routes filtrées (OpaAuthorize refuse sans réponse)
      - '*-postgresql'
      - keycloak*
      - kafka
      - '*-kafka'
      - stockage-objet*
      - minio*
      - '*-redis'
      - '*-valkey'
      - valkey*
      - redis*
    docker:
      url: http://localhost:2375
      projet: gimac-des
      delai-arret: 10
    kubernetes:
      url: https://kubernetes.default.svc
      espace: gimac-des
      jeton: /var/run/secrets/kubernetes.io/serviceaccount/token
      autorite: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
