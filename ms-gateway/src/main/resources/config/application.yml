# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
reactive:
  feign:
    circuit:
      breaker:
        enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - gateway
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: gateway
  cloud:
    discovery:
      client:
        simple:
          instances:
            gateway:
              - instanceId: gateway1
                host: localhost
                port: 8080
    gateway:
      server:
        webflux:
          default-filters:
            - TokenRelay
          httpclient:
            pool:
              max-connections: 1000
          routes:
            # Routes déclarées vers les microservices (GW-19). Adresses : propriétés gimac.services.*
            # (localhost en DEV, nom du service en prod). Les routes JHipster /services/{service}/** (et
            # /services/gateway/**) sont retirées : sans OpaAuthorize, elles ouvraient le CRUD généré des
            # services (/api/**) et leurs points /management à tout jeton portant ROLE_ADMIN, hors OPA et
            # hors règles métier. Aucun client ne les utilisait (couches : /bff/** et /api/** ; sondes,
            # Prometheus et supervision : adresse directe du service). SecurityConfiguration refuse en
            # outre /services/** (denyAll) ; toute route déclarée ici commence par OpaAuthorize
            # (RoutesPresentationTest).
            # Couches de présentation du lot 1 (PI-GIMAC-01 §0.6) : OPA d'abord, sur le chemin
            # d'origine, puis réécriture vers l'API v1 du service. TokenRelay est un filtre par défaut.
            - id: des-homologation
              uri: ${gimac.services.homologation}
              predicates:
                - Path=/bff/des/homologation/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/des/homologation/(?<p>.*), /api/v1/${p}
            - id: portail-homologation
              uri: ${gimac.services.homologation}
              predicates:
                - Path=/bff/portail/homologation/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/portail/homologation/(?<p>.*), /api/v1/portail/${p}
            - id: des-participant
              uri: ${gimac.services.participant}
              predicates:
                - Path=/bff/des/participant/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/des/participant/(?<p>.*), /api/v1/${p}
            - id: portail-participant
              uri: ${gimac.services.participant}
              predicates:
                - Path=/bff/portail/participant/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/portail/participant/(?<p>.*), /api/v1/portail/${p}
            - id: des-certification
              uri: ${gimac.services.certification}
              predicates:
                - Path=/bff/des/certification/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/des/certification/(?<p>.*), /api/v1/${p}
            - id: portail-certification
              uri: ${gimac.services.certification}
              predicates:
                - Path=/bff/portail/certification/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/portail/certification/(?<p>.*), /api/v1/portail/${p}
            # MS-IAM (D-62) : « Mon compte » et défi de réauthentification depuis chaque couche ;
            # comptes, journal, politique et profils depuis la console et le département (D-69) ;
            # serveur de courriels depuis la console seulement. Les routes /interne ne sont
            # jamais relayées (aucun prédicat ne les couvre, OPA les refuse).
            # « Mon compte » (D-62, D-65, docs/lot1/mon-compte.md) : fiche, mot de passe (fermeture des autres
            # sessions par la passerelle), code TOTP, photo de profil (PUT/DELETE/GET …/moi/avatar).
            - id: iam-libre-service
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/{couche}/iam/moi,/bff/{couche}/iam/moi/**,/bff/{couche}/iam/reauthentification/defi
              filters:
                - OpaAuthorize
                - FermetureAutresSessions
                # Photo de profil : 2 Mo au plus (MS-IAM), corps multipart annoncé borné à 3 Mo, 413 au-delà.
                - name: RequestSize
                  args:
                    maxSize: 3MB
                - RewritePath=/bff/(?<couche>des|portail|console)/iam/(?<p>.*), /api/v1/${p}
            # Photos de profil des collègues (mon-compte.md §1) : département et console seulement ; le
            # portail n'a accès qu'à la photo de son titulaire (…/moi/avatar).
            - id: iam-avatars
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/des/iam/avatars/**,/bff/console/iam/avatars/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/(?<couche>des|console)/iam/avatars/(?<p>.*), /api/v1/avatars/${p}
            # Reprise de l'existant (D-107, docs/exploitation/reprise-des-donnees.md) depuis la console : super
            # administrateur (REF_REPRISE_IMPORT, OPA), corps JSON de 10 Mo au plus. L'outil infra/reprise appelle les
            # routes internes équivalentes (/api/v1/interne/reprise/**) avec le jeton du compte de service reprise-service.
            - id: console-reprise-participant
              uri: ${gimac.services.participant}
              predicates:
                - Path=/bff/console/participant/reprise/institutions
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 10MB
                - RewritePath=/bff/console/participant/reprise/(?<p>.*), /api/v1/reprise/${p}
            - id: console-reprise-homologation
              uri: ${gimac.services.homologation}
              predicates:
                - Path=/bff/console/homologation/reprise/liaisons
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 10MB
                - RewritePath=/bff/console/homologation/reprise/(?<p>.*), /api/v1/reprise/${p}
            # Sandbox GIMAC, administration déléguée des comptes d'une institution (D-115, docs/lot1/sandbox-existant-adapte.md §4
            # US-EXI-03) : portail seulement, administrateur de l'institution (OPA) ; MS-IAM borne chaque acte à
            # l'institution du jeton ; en-tête Idempotency-Key des étapes de saga relayé tel quel.
            - id: portail-sbx-habilitations
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/portail/sbx-habilitations/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - RewritePath=/bff/portail/sbx-habilitations/(?<p>.*), /api/v1/administration-deleguee/${p}
            # D-119 (lot IAM de l'épopée EXI, docs/lot1/sandbox-existant-adapte.md §6) : la sandbox dans la console de la
            # plateforme (périmètres suspendus, comptes protégés, délégations, comptes de service), filtrée par OPA.
            - id: console-iam-sandbox
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/console/iam/sandbox/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - RewritePath=/bff/console/iam/sandbox/(?<p>.*), /api/v1/sandbox/${p}
            - id: console-iam
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/console/iam/comptes,/bff/console/iam/comptes/**,/bff/console/iam/configuration/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/console/iam/(?<p>.*), /api/v1/${p}
            # Administration dans le département (D-69) : RSSI et super administrateur, mêmes permissions (OPA).
            # Catalogue des fonctionnalités (D-94) : lecture par tout compte interne, modification par IAM_PROFILE_EDIT (OPA).
            - id: des-iam-administration
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/des/iam/comptes,/bff/des/iam/comptes/**,/bff/des/iam/configuration/politique-securite,/bff/des/iam/configuration/profils,/bff/des/iam/configuration/profils/**,/bff/des/iam/configuration/permissions,/bff/des/iam/configuration/fonctionnalites,/bff/des/iam/configuration/fonctionnalites/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/des/iam/(?<p>.*), /api/v1/${p}
            # Organisation du GIMAC (D-76, docs/lot1/mon-activite.md §1.3) : catalogue des unités et rattachement
            # du titulaire, depuis le département et la console ; comptes internes seulement (OPA). D-102
            # (docs/lot1/organigramme.md) : affectations d'une unité (POST, DELETE …/unites/{code}/affectations) et
            # organigramme en PDF (GET …/organigramme.pdf, quelques secondes, aucun délai global de la passerelle).
            - id: iam-organisation
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/des/iam/organisation/**,/bff/console/iam/organisation/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/(?<couche>des|console)/iam/organisation/(?<p>.*), /api/v1/organisation/${p}
            # Pouvoirs des chefs et demandes à l'administration (D-81, docs/lot1/pouvoirs-hierarchiques.md §3, §4) :
            # comptes internes seulement (OPA).
            - id: iam-pouvoirs-demandes
              uri: ${gimac.services.iam}
              predicates:
                - Path=/bff/des/iam/pouvoirs/**,/bff/console/iam/pouvoirs/**,/bff/des/iam/demandes,/bff/des/iam/demandes/**,/bff/console/iam/demandes,/bff/console/iam/demandes/**
              filters:
                - OpaAuthorize
                - RewritePath=/bff/(?<couche>des|console)/iam/(?<p>.*), /api/v1/${p}
            # MS-PILOTAGE, « Mon activité » (D-76, docs/lot1/mon-activite.md §2) : agenda, activités, tâches,
            # rapports et équipe de tout membre interne ; corps JSON seulement (documents par dépôts fragmentés).
            # Processus d'unité (D-87, docs/lot1/processus-unite.md §3 et §5) : /bff/des/pilotage/processus/** vers
            # /api/v1/processus/** par cette même route (pas de route dédiée, qui doublerait celle-ci) ; méthodes GET,
            # POST, PUT et DELETE filtrées par OPA ; l'en-tête X-Reauth-Assertion de la signature est relayé tel quel.
            # D-103 : PUT /bff/des/pilotage/processus/{id}/public (public d'une version publiée) passe par cette route.
            - id: des-pilotage
              uri: ${gimac.services.pilotage}
              predicates:
                - Path=/bff/des/pilotage/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/des/pilotage/(?<p>.*), /api/v1/${p}
            # MS-MONITORING, supervision des liaisons, astreintes et relève de quart (D-114,
            # docs/lot1/astreintes-monitoring.md §8) : liaisons, alertes et acquittement, vacations et main courante,
            # rapport de relève (signature, contresignature, visa), grille d'astreinte et échanges ; seuls les chemins
            # listés par OPA passent, jamais pour un compte d'institution ; /interne/** n'est jamais relayé ;
            # X-Reauth-Assertion des signatures relayé tel quel.
            - id: des-monitoring
              uri: ${gimac.services.monitoring}
              predicates:
                - Path=/bff/des/monitoring/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - RewritePath=/bff/des/monitoring/(?<p>.*), /api/v1/${p}
            # MS-NOTIFICATION, notifications de la plateforme (D-80, docs/lot1/notifications.md §3) : cloche et
            # préférences de chacun, depuis le département et la console (comptes internes) et le portail (comptes
            # d'institution, D-93 §11.4) ; routes et comptes filtrés par OPA.
            - id: notification-boite
              uri: ${gimac.services.notification}
              predicates:
                - Path=/bff/des/notification/**,/bff/console/notification/**,/bff/portail/notification/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - RewritePath=/bff/(?<couche>des|console|portail)/notification/(?<p>.*), /api/v1/${p}
            # MS-DOCUMENT : dépôt direct d'une pièce (empreinte calculée par le service).
            - id: depot-document
              uri: ${gimac.services.document}
              predicates:
                - Path=/bff/des/document/documents,/bff/portail/document/documents
              filters:
                - OpaAuthorize
                - RewritePath=/bff/(?<couche>des|portail)/document/documents, /api/v1/documents
            # MS-DOCUMENT, dépôts fragmentés (claim check, D-74, docs/lot1/depots-fragmentes.md §3) : ouverture,
            # parties de 16 Mio en octets bruts, état, fin et abandon, depuis les trois couches (OPA : permissions
            # de dépôt ou COL_MESSAGE_SEND ; portail : HOM_PORTAL_SUBMIT et institution). Corps borné à 17 Mio
            # (une partie et sa marge), 413 au-delà.
            - id: depot-fragmente
              uri: ${gimac.services.document}
              predicates:
                - Path=/bff/des/document/depots/**,/bff/console/document/depots/**,/bff/portail/document/depots/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 17MB
                - RewritePath=/bff/(?<couche>des|console|portail)/document/depots(?<p>/.*)?, /api/v1/depots${p}
            # MS-DOCUMENT, aperçu des documents bureautiques (D-83, docs/lot1/apercu-bureautique.md §2) : fichier en
            # octets bruts converti en PDF, depuis le département et la console ; comptes internes seulement (OPA,
            # PIL_ACTIVITY_OWN). Corps de 20 Mo au plus, 413 au-delà. Conversion de 60 s au plus par le moteur : délai
            # de réponse de la route porté à 90 s (aucun délai global n'est imposé par la passerelle).
            - id: document-apercus
              uri: ${gimac.services.document}
              predicates:
                - Path=/bff/des/document/apercus,/bff/console/document/apercus
              metadata:
                response-timeout: 90000
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 20MB
                - RewritePath=/bff/(?<couche>des|console)/document/apercus, /api/v1/apercus
            # MS-COLLABORATION, messagerie instantanée de travail (D-64, docs/lot1/messagerie.md §1) :
            # tout membre interne, depuis le DES et la console (OPA refuse les comptes d'institution). Envois multipart relayés en flux (5 pièces de 20 Mo au plus) : la
            # taille annoncée est bornée à 101 Mo (pièces, partie JSON et délimiteurs), au-delà 413.
            - id: des-collaboration-messagerie
              uri: ${gimac.services.collaboration}
              predicates:
                - Path=/bff/des/collaboration/messagerie/**,/bff/console/collaboration/messagerie/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 101MB
                - RewritePath=/bff/(?<couche>des|console)/collaboration/messagerie/(?<p>.*), /api/v1/messagerie/${p}
            # Sandbox GIMAC (D-120, docs/lot1/sandbox-existant-adapte.md §6, US-EXI-07) : routes console et portail des onze
            # services de la sandbox, et la seule route du département /bff/des/sbx-espace (D-118, administration des espaces
            # depuis la plateforme, API console de SBX-ESPACE). OPA d'abord (permissions SBX_<MODULE>_<FONCTION>), puis
            # CloisonnementSandbox (institution propre ou mandante d'un mandat actif, jeton interne réduit, quota par couche,
            # institution et route, décision journalisée vers MS-AUDIT). Adresses : gimac.services.sbx-* seulement, jamais un
            # système de production (GW-21, RoutesSandboxTest).
            - id: console-sbx-espace
              uri: ${gimac.services.sbx-espace}
              predicates:
                - Path=/bff/console/sbx-espace/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-espace/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-espace
              uri: ${gimac.services.sbx-espace}
              predicates:
                - Path=/bff/portail/sbx-espace/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-espace/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-raccordement
              uri: ${gimac.services.sbx-raccordement}
              predicates:
                - Path=/bff/console/sbx-raccordement/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-raccordement/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-raccordement
              uri: ${gimac.services.sbx-raccordement}
              predicates:
                - Path=/bff/portail/sbx-raccordement/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-raccordement/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-referentiel
              uri: ${gimac.services.sbx-referentiel}
              predicates:
                - Path=/bff/console/sbx-referentiel/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-referentiel/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-referentiel
              uri: ${gimac.services.sbx-referentiel}
              predicates:
                - Path=/bff/portail/sbx-referentiel/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-referentiel/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-donnees
              uri: ${gimac.services.sbx-donnees}
              predicates:
                - Path=/bff/console/sbx-donnees/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-donnees/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-donnees
              uri: ${gimac.services.sbx-donnees}
              predicates:
                - Path=/bff/portail/sbx-donnees/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-donnees/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-simulation
              uri: ${gimac.services.sbx-simulation}
              predicates:
                - Path=/bff/console/sbx-simulation/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-simulation/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-simulation
              uri: ${gimac.services.sbx-simulation}
              predicates:
                - Path=/bff/portail/sbx-simulation/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-simulation/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-mobile
              uri: ${gimac.services.sbx-mobile}
              predicates:
                - Path=/bff/console/sbx-mobile/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-mobile/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-mobile
              uri: ${gimac.services.sbx-mobile}
              predicates:
                - Path=/bff/portail/sbx-mobile/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-mobile/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-iso20022
              uri: ${gimac.services.sbx-iso20022}
              predicates:
                - Path=/bff/console/sbx-iso20022/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-iso20022/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-iso20022
              uri: ${gimac.services.sbx-iso20022}
              predicates:
                - Path=/bff/portail/sbx-iso20022/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-iso20022/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-carte
              uri: ${gimac.services.sbx-carte}
              predicates:
                - Path=/bff/console/sbx-carte/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-carte/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-carte
              uri: ${gimac.services.sbx-carte}
              predicates:
                - Path=/bff/portail/sbx-carte/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-carte/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-campagne
              uri: ${gimac.services.sbx-campagne}
              predicates:
                - Path=/bff/console/sbx-campagne/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-campagne/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-campagne
              uri: ${gimac.services.sbx-campagne}
              predicates:
                - Path=/bff/portail/sbx-campagne/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-campagne/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-trace
              uri: ${gimac.services.sbx-trace}
              predicates:
                - Path=/bff/console/sbx-trace/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-trace/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-trace
              uri: ${gimac.services.sbx-trace}
              predicates:
                - Path=/bff/portail/sbx-trace/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-trace/(?<p>.*), /api/v1/portail/${p}
            - id: console-sbx-lecture
              uri: ${gimac.services.sbx-lecture}
              predicates:
                - Path=/bff/console/sbx-lecture/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/console/sbx-lecture/(?<p>.*), /api/v1/console/${p}
            - id: portail-sbx-lecture
              uri: ${gimac.services.sbx-lecture}
              predicates:
                - Path=/bff/portail/sbx-lecture/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/portail/sbx-lecture/(?<p>.*), /api/v1/portail/${p}
            - id: des-sbx-espace
              uri: ${gimac.services.sbx-espace}
              predicates:
                - Path=/bff/des/sbx-espace/**
              filters:
                - OpaAuthorize
                - CloisonnementSandbox
                - name: RequestSize
                  args:
                    maxSize: 1MB
                - RewritePath=/bff/des/sbx-espace/(?<p>.*), /api/v1/console/${p}
            # D-120 (US-EXI-08) : types de pièces de la sandbox et quarantaines de MS-DOCUMENT, depuis la console ;
            # comptes du GIMAC seulement (OPA, SBX_TRA_CONSULTATION en lecture, SBX_TRA_ADMINISTRATION en écriture).
            - id: console-document-sandbox
              uri: ${gimac.services.document}
              predicates:
                - Path=/bff/console/document/sandbox/**
              filters:
                - OpaAuthorize
                - name: RequestSize
                  args:
                    maxSize: 64KB
                - RewritePath=/bff/console/document/sandbox/(?<p>.*), /api/v1/sandbox/${p}
          # See alternatives in https://github.com/spring-cloud/spring-cloud-gateway/issues/3818
          trusted-proxies: '.*'
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/services.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - kafka
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
      prod:
        - kafka
  jmx:
    enabled: false
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  webflux:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          # Connexion sur la plateforme (D-65, docs/lot1/connexion.md §2) : octroi direct de serveur à
          # serveur, jamais de redirection vers Keycloak. « oidc » : client web_app (mot de passe et code
          # TOTP obligatoire, acr 2) ; « connexion » : client gimac-connexion (mot de passe seul, acr 1,
          # session restreinte du premier accès). Secrets par variables d'environnement seulement.
          oidc:
            scope: openid, profile
          connexion:
            provider: oidc
            client-id: ${GIMAC_CONNEXION_CLIENT_ID:gimac-connexion}
            client-secret: ${GIMAC_SECRET_CONNEXION:}
            scope: openid, profile
          # Jeton de service de la passerelle vers MS-IAM (etat-connexion, mot de passe oublié), gardé
          # jusqu'à son expiration.
          gateway-service:
            provider: oidc
            client-id: ${GIMAC_SERVICE_CLIENT_ID:gateway-service}
            client-secret: ${GIMAC_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
          # Jeton de service de la supervision de la plateforme (D-61) : client Keycloak
          # « gateway-supervision » ; identifiant et secret fournis par l'environnement.
          supervision:
            provider: oidc
            client-id: ${GIMAC_SUPERVISION_CLIENT_ID:gateway-supervision}
            client-secret: ${GIMAC_SUPERVISION_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
  task:
    execution:
      thread-name-prefix: gateway-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: gateway-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true
  # Session de la passerelle (D-65 §2 et §6) : témoin HttpOnly, Secure, SameSite=Lax. Le magasin garde
  # la session jusqu'à la durée maximale ; l'inactivité (30 min) est jugée par la passerelle, qui révoque
  # alors les jetons chez Keycloak (GardeSessionWebFilter, balayage chaque minute).
  reactive:
    session:
      timeout: 10h
      cookie:
        http-only: true
        secure: ${GIMAC_SESSION_TEMOIN_SECURISE:true}
        same-site: lax

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

