---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

---
# ---------------------------------------------------------------------------
# Lot 1 (PI-GIMAC-01 §0.4, §0.7) et tranche DDRM (D-57) : outbox, file de rebut,
# jeton de service, adaptateurs et dossier d'adhésion.
# ---------------------------------------------------------------------------
spring:
  security:
    oauth2:
      client:
        registration:
          # Jeton de service (PI §0.7) : client Keycloak participant-service, secret fourni par l'environnement.
          service-token:
            provider: oidc
            client-id: ${GIMAC_SERVICE_CLIENT_ID:participant-service}
            client-secret: ${GIMAC_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid
  kafka:
    # Producteur de l'outbox : même courtier que le binder Spring Cloud Stream.
    bootstrap-servers: ${spring.cloud.stream.kafka.binder.brokers:localhost:9092}
    producer:
      # Explicites : le liant Spring Cloud Stream impose sinon ByteArraySerializer
      # par défaut, et le relais de l'outbox (clés et enveloppes String) échoue.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    # Consommateurs des événements des autres services (@KafkaListener) : chaînes, lecture depuis le
    # début d'un sujet pour un nouveau groupe (aucun événement perdu au premier démarrage).
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
gimac:
  outbox:
    delay: 500
  # Sélection des adaptateurs, un port à la fois (PI §0.8) : real | stub.
  adapters:
    document-registry: stub
    reauth: stub
  services:
    document:
      url: http://localhost:8083
    iam:
      url: http://localhost:8081
  securite:
    # D-61 : les routes métier exigent un jeton issu d'une authentification à deux facteurs.
    # Keycloak pose acr selon le niveau d'assurance atteint (LoA 2 : mot de passe et OTP ou FIDO2).
    double-facteur:
      exige: true
      niveaux-acr: 2,3
  kafka:
    rebut:
      actif: true
      nombre-tentatives: 3
      intervalle-ms: 1000
  participant:
    adhesion:
      # Pièces du dossier d'adhésion (CR-CERT rang 2). Le CR ne les énumère pas :
      # liste initiale à confirmer par la DDRM, modifiable sans redéploiement de code.
      pieces:
        - { code: DEMANDE_ADHESION, libelle: "Lettre de demande d'adhésion", obligatoire: true }
        - { code: STATUTS, libelle: "Statuts de l'établissement", obligatoire: true }
        - { code: AGREMENT, libelle: "Agrément ou autorisation d'exercer", obligatoire: true }
        - { code: REGISTRE_COMMERCE, libelle: "Extrait du registre du commerce", obligatoire: true }
        - { code: FICHE_RENSEIGNEMENTS, libelle: "Fiche de renseignements signée", obligatoire: true }
        - { code: ORGANIGRAMME, libelle: "Organigramme et interlocuteurs désignés", obligatoire: false }
