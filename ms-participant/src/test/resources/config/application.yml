# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: participant
  cloud:
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    datatype:
      datetime:
        write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://DO_NOT_CALL:9080/realms/jhipster
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
  task:
    execution:
      thread-name-prefix: participant-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: participant-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  mail:
    from: participant@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false

# Lot 1 : adaptateurs de substitution et paramètres métier des tests (PI §0.8).
gimac:
  outbox:
    delay: 500
  adapters:
    document-registry: stub
    reauth: stub
  services:
    document:
      url: http://localhost:8083
    iam:
      url: http://localhost:8081
  kafka:
    rebut:
      actif: false
  securite:
    double-facteur:
      exige: true
      niveaux-acr: 2,3
  participant:
    adhesion:
      pieces:
        - { code: DEMANDE_ADHESION, libelle: "Lettre de demande d'adhésion", obligatoire: true }
        - { code: STATUTS, libelle: "Statuts de l'établissement", obligatoire: true }
        - { code: ORGANIGRAMME, libelle: "Organigramme et interlocuteurs désignés", obligatoire: false }
