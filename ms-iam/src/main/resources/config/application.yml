# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: iam
  jackson:
    # Champs booléens et numériques facultatifs dans les requêtes : valeur par défaut (Jackson 3).
    deserialization:
      fail-on-null-for-primitives: false
  docker:
    compose:
      enabled: true
      lifecycle-management: start-only
      file: src/main/docker/postgresql.yml
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - kafka
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
      prod:
        - kafka
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  servlet:
    # Photo de profil (docs/lot1/mon-compte.md §1) : la règle des 2 Mo est appliquée par le domaine
    # (IAM_AVATAR_TOO_LARGE) ; au-delà de 3 Mo, la requête est refusée avant lecture (même code).
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          oidc:
            scope: openid, profile
  task:
    execution:
      thread-name-prefix: iam-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: iam-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  mail:
    from: iam@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Iam API
    description: Iam API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    oauth2:
      audience:
        - account
        - api://default


# jhipster-needle-add-application-yaml-document
---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

---
# ---------------------------------------------------------------------------
# Socle du lot (PI-GIMAC-01 §0.4, §0.7), administration des comptes et
# réauthentification forte (D-61) : outbox, jeton de service, adaptateurs.
# ---------------------------------------------------------------------------
spring:
  security:
    oauth2:
      client:
        registration:
          # Jeton de service (PI §0.7) : client Keycloak iam-service, secret fourni par l'environnement.
          # Il porte aussi les rôles d'administration du realm (manage-users, view-realm, manage-realm)
          # utilisés par l'adaptateur Keycloak.
          service-token:
            provider: oidc
            client-id: ${GIMAC_SERVICE_CLIENT_ID:iam-service}
            client-secret: ${GIMAC_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid
  kafka:
    bootstrap-servers: ${spring.cloud.stream.kafka.binder.brokers:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
gimac:
  outbox:
    delay: 500
  # Sélection des adaptateurs (PI §0.8) : real | stub.
  adapters:
    annuaire: stub
    courriel: stub
  kafka:
    rebut:
      actif: true
      nombre-tentatives: 3
      intervalle-ms: 1000
  securite:
    # D-61 : routes métier réservées aux jetons issus d'une authentification à deux facteurs.
    double-facteur:
      exige: true
      niveaux-acr: 2,3
  iam:
    keycloak:
      url: ${GIMAC_KEYCLOAK_URL:http://localhost:9080}
      realm: ${GIMAC_KEYCLOAK_REALM:gimac}
      client-id: ${GIMAC_SERVICE_CLIENT_ID:iam-service}
      client-secret: ${GIMAC_SERVICE_CLIENT_SECRET:}
    # Actions exigées par la plateforme au premier accès d'un compte créé par l'administration (D-65),
    # tenues dans l'attribut gimac_actions_requises, jamais dans les actions requises de Keycloak.
    premiere-connexion:
      actions: [MOT_DE_PASSE, SECOND_FACTEUR, FICHE, CHARTE]
    # Liens des courriels de la plateforme (invitation 24 h, mot de passe oublié 30 min), construits sur
    # l'adresse publique de chaque couche ; enrôlement TOTP gardé 10 min (D-65).
    liens:
      des: ${GIMAC_URL_DES:http://localhost:4200}
      portail: ${GIMAC_URL_PORTAIL:http://localhost:4201}
      console: ${GIMAC_URL_CONSOLE:http://localhost:4202}
      validite-invitation: 24h
      validite-reinitialisation: 30m
      validite-enrolement-totp: 10m
      # D-94 : les liens d'un compte mènent à la console quand ses profils composent l'une de ces permissions
      # (même liste que PERMISSIONS_CONSOLE, frontend/packages/socle/src/session/aiguillage.ts).
      permissions-console: [IAM_ACCOUNT_READ, PLATFORM_SUPERVISION_READ, PLATFORM_CONFIG_READ, PLATFORM_OPS_READ, PLATFORM_SECURITY_POLICY_READ, PLATFORM_MESSAGING_EDIT]
    # Client gimac-connexion (octroi direct, mot de passe seul) : vérification du mot de passe actuel ;
    # clients de service admis sur /api/v1/interne/connexion/** et l'état de connexion (la passerelle).
    connexion:
      client-id: ${GIMAC_CONNEXION_CLIENT_ID:gimac-connexion}
      client-secret: ${GIMAC_SECRET_CONNEXION:}
      clients-internes: gateway-service
    # Clé AES-256 (32 octets en base 64) des secrets gardés par MS-IAM (enrôlements TOTP, mot de passe
    # SMTP) ; absente : clé éphémère (développement), à fournir en production.
    chiffrement:
      cle: ${GIMAC_IAM_CLE_CHIFFREMENT:}
    # Profils livrés attribuables (rôles composites du realm). D-94 (docs/lot1/ecrans-par-configuration.md) : aucune
    # qualité n'est décrite par un nom de profil ; un profil est privilégié dès qu'il porte une permission IAM_* ou
    # PLATFORM_* (attribution réservée à IAM_ROLE_PRIVILEGED_GRANT), externe selon son attribut gimac_externe.
    # externes-initiaux : profils qui reçoivent gimac_externe=true au démarrage s'ils n'ont pas encore l'attribut.
    profils:
      attribuables: [ROLE_SUPER_ADMIN, ROLE_RSSI, ROLE_CHEF_DES, ROLE_INGENIEUR_HOMOLOGATION, ROLE_CONFORMITE, ROLE_DG, ROLE_CORRESPONDANT,
        ROLE_CHARGE_DDRM, ROLE_CHEF_DDRM, ROLE_SNA, ROLE_PRODUCTION_MONETIQUE, ROLE_POLE_RESEAU, ROLE_POLE_SYSTEME, ROLE_CONDUCTEUR_PROJET,
        ROLE_COLLABORATEUR, ROLE_RESPONSABLE_SERVICE, ROLE_ADMIN_SYSTEME]
      externes-initiaux: [ROLE_CORRESPONDANT]
    # Réauthentification forte FIDO2 (IAM-07).
    webauthn:
      rp-id: ${GIMAC_WEBAUTHN_RP_ID:localhost}
      rp-nom: Plateforme Moabi du GIMAC
      origines: ${GIMAC_WEBAUTHN_ORIGINES:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:8080}
      validite-defi: 2m
