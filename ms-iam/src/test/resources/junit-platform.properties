# Délais de garde des tests : assez larges pour la charge des constructions parallèles sur le poste de
# développement (premiers chargements de MockMvc et de webauthn4j au-delà de 15 s observés), assez
# courts pour signaler un test bloqué.
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.testable.method.default = 60 s
junit.jupiter.execution.timeout.beforeall.method.default = 120 s
junit.jupiter.testclass.order.default=cm.gimac.des.iam.config.SpringBootTestClassOrderer
