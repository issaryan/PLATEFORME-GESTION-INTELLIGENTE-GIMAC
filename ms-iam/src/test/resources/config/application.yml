# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  kafka:
    # Comme en principal : le liant Spring Cloud Stream imposerait ByteArraySerializer.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  application:
    name: iam
  cloud:
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson:
    # Champs booléens et numériques facultatifs dans les requêtes : valeur par défaut (Jackson 3).
    deserialization:
      fail-on-null-for-primitives: false
    datatype:
      datetime:
        write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: http://DO_NOT_CALL:9080/realms/jhipster
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
  task:
    execution:
      thread-name-prefix: iam-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: iam-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  mail:
    from: iam@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false

# Socle du lot et administration des comptes (D-61, D-62) : adaptateurs de substitution.
gimac:
  outbox:
    delay: 500
  adapters:
    annuaire: stub
    courriel: stub
  kafka:
    rebut:
      actif: false
  securite:
    double-facteur:
      exige: true
      niveaux-acr: 2,3
  iam:
    keycloak:
      url: http://localhost:9080
      realm: gimac
      client-id: iam-service
      client-secret: test
    premiere-connexion:
      actions: [MOT_DE_PASSE, SECOND_FACTEUR, FICHE, CHARTE]
    liens:
      des: https://des.gimac.test
      portail: https://portail.gimac.test/
      console: https://console.gimac.test
      validite-invitation: 24h
      validite-reinitialisation: 30m
      validite-enrolement-totp: 10m
    connexion:
      client-id: gimac-connexion
      client-secret: test
      clients-internes: gateway-service
    profils:
      attribuables: [ROLE_SUPER_ADMIN, ROLE_RSSI, ROLE_CHEF_DES, ROLE_INGENIEUR_HOMOLOGATION, ROLE_CONFORMITE, ROLE_DG, ROLE_CORRESPONDANT,
        ROLE_CHARGE_DDRM, ROLE_CHEF_DDRM, ROLE_SNA, ROLE_PRODUCTION_MONETIQUE, ROLE_POLE_RESEAU, ROLE_POLE_SYSTEME, ROLE_CONDUCTEUR_PROJET]
      privilegies: [ROLE_SUPER_ADMIN, ROLE_RSSI]
    webauthn:
      rp-id: localhost
      rp-nom: Plateforme Moabi du GIMAC
      origines: http://localhost
      validite-defi: 2m
