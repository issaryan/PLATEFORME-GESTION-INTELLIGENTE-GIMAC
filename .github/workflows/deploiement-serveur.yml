# Ancien déploiement du serveur de démonstration (10.20.36.214) : copie du dépôt et construction sur place.
# Depuis le 09/10/2026, le serveur est livré depuis un poste, sans code source ni GitHub Actions
# (infra/ci/livrer-serveur.sh, docs/exploitation/livraison-serveur.md) : plus de déclenchement à la poussée,
# lancement manuel seulement, en secours.
#
# Exécuté par l'exécuteur auto-hébergé du serveur (étiquette gimac-214) : construction des images
# sur place et redémarrage des seuls conteneurs changés (infra/ci/deployer-serveur.sh). Indépendant
# de ci.yml, qui reste la référence de la définition de « terminé » (D-61) et du déploiement en recette.
name: Déploiement du serveur de démonstration

on:
  workflow_dispatch:

# Une seule mise à jour à la fois ; une poussée plus récente remplace celle en attente.
concurrency:
  group: deploiement-serveur
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploiement:
    name: Déploiement sur gimac-214
    # Remplacé par deploiement-serveur-images.yml (sans code source) quand la variable du dépôt
    # GIMAC_DEPLOIEMENT_SERVEUR vaut « images » ; reste lançable à la main.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.GIMAC_DEPLOIEMENT_SERVEUR != 'images' }}
    runs-on: [self-hosted, gimac-214]
    timeout-minutes: 120
    steps:
      # clean: false conserve les fichiers non versionnés du serveur (.env et ses secrets,
      # comptes nominatifs) et les constructions Maven précédentes.
      - uses: actions/checkout@v7
        with:
          clean: false
      - name: Construction et démarrage
        run: infra/ci/deployer-serveur.sh
