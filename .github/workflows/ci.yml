# Chaîne d'intégration et de déploiement continus de la plateforme DES (D-61).
#
# Toute la logique vit dans infra/ci (scripts exécutables à l'identique sur un poste) ;
# ce fichier ne fait qu'installer les outils et enchaîner les étapes. Voir infra/ci/README.md.
#
#   infra       validation statique de l'infrastructure (Compose, OPA, Kubernetes, supervision,
#               Dockerfiles, domaine Keycloak, scripts, YAML, cette définition)
#   backend     14 microservices : tests unitaires, d'intégration (Testcontainers),
#               d'acceptation (Cucumber), Checkstyle, seuils JaCoCo
#   frontend    types et lint, Vitest (≥ 80 %), construction, Playwright (≥ 80 %)
#   securite    secrets (gitleaks) et vulnérabilités (Trivy)
#   images      sur main seulement : construction, publication GHCR et signature cosign
#   deploiement sur main seulement : application en recette (environnement protégé)
name: CI/CD plateforme DES

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Une demande de fusion ne garde que sa dernière exécution ; main va toujours au bout.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GIMAC_CI_STRICT: "1"
  FORCE_COLOR: "0"

jobs:
  preparation:
    name: Préparation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      services: ${{ steps.services.outputs.services }}
      registre: ${{ steps.registre.outputs.registre }}
    steps:
      - uses: actions/checkout@v7
      - name: Microservices munis de tests
        id: services
        run: echo "services=$(infra/ci/valider-backend.sh --lister-json)" >> "$GITHUB_OUTPUT"
      - name: Registre des images (nom en minuscules exigé par GHCR)
        id: registre
        env:
          PROPRIETAIRE: ${{ github.repository_owner }}
        run: echo "registre=ghcr.io/${PROPRIETAIRE,,}/gimac-des" >> "$GITHUB_OUTPUT"

  infra:
    name: Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Outils de validation (versions épinglées)
        run: |
          GIMAC_DOSSIER_OUTILS="$RUNNER_TEMP/outils" infra/ci/installer-outils.sh
          echo "$RUNNER_TEMP/outils" >> "$GITHUB_PATH"
      - name: Validation de l'infrastructure
        run: infra/ci/valider-infra.sh

  backend:
    name: Backend (${{ matrix.service }})
    needs: preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.preparation.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      # Docker est fourni par l'exécuteur ubuntu : Testcontainers y démarre PostgreSQL, Kafka, etc.
      - name: Tests unitaires, d'intégration et d'acceptation, seuils de couverture
        run: infra/ci/valider-backend.sh "${{ matrix.service }}"
      - name: Rapports de tests et de couverture
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-${{ matrix.service }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
            ${{ matrix.service }}/target/site/jacoco/
            ${{ matrix.service }}/target/site/jacoco-it/

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dépendances (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Navigateur des tests de bout en bout
        run: npx playwright install --with-deps chromium
      - name: Lint, Vitest (≥ 80 %), construction, Playwright (≥ 80 %)
        env:
          GIMAC_NPM_CI: "0"
        run: ../infra/ci/valider-frontend.sh --e2e
      - name: Contrat des routes (frontend, passerelle, OPA, contrôleurs)
        env:
          GIMAC_CI_STRICT: "1"
        run: ../infra/ci/valider-contrat.sh
      - name: Rapports de couverture et de tests de bout en bout
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-couverture
          retention-days: 14
          if-no-files-found: ignore
          path: |
            frontend/packages/*/coverage/
            frontend/apps/*/coverage/
            frontend/e2e/couverture/
            frontend/e2e/resultats/

  securite:
    name: Sécurité
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (version épinglée)
        run: |
          GIMAC_DOSSIER_OUTILS="$RUNNER_TEMP/outils" infra/ci/installer-outils.sh gitleaks
          echo "$RUNNER_TEMP/outils" >> "$GITHUB_PATH"
      - name: Commits à examiner
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          TETE_PR: ${{ github.event.pull_request.head.sha }}
          AVANT: ${{ github.event.before }}
        run: |
          if [ "$EVENEMENT" = pull_request ]; then
            echo "GIMAC_PLAGE_COMMITS=$BASE_PR..$TETE_PR" >> "$GITHUB_ENV"
          elif [ -n "$AVANT" ] && [ "$AVANT" != 0000000000000000000000000000000000000000 ]; then
            echo "GIMAC_PLAGE_COMMITS=$AVANT..$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Secrets en clair (gitleaks)
        env:
          GIMAC_TRIVY: "0"
        run: infra/ci/valider-securite.sh
      - name: Vulnérabilités des dépendances (Trivy, HIGH et CRITICAL corrigeables)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: frontend/node_modules
      - name: Configuration Docker et Kubernetes (Trivy, informatif)
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "0"

  images:
    name: Image ${{ matrix.cible }}
    # Publication seulement après validation complète d'un commit de main.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [preparation, infra, backend, frontend, securite]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write # signature cosign sans clé (identité OIDC du workflow)
    strategy:
      fail-fast: false
      matrix:
        cible:
          - frontend
          - keycloak
          - ms-audit
          - ms-certification
          - ms-collaboration
          - ms-document
          - ms-gateway
          - ms-homologation
          - ms-iam
          - ms-incident
          - ms-monitoring
          - ms-notification
          - ms-participant
          - ms-pilotage
          - ms-rapprochement
          - ms-reporting
    env:
      GIMAC_REGISTRE: ${{ needs.preparation.outputs.registre }}
      GIMAC_ETIQUETTE: ${{ github.sha }}
      GIMAC_SIGNATURE_SANS_CLE: "1"
      GIMAC_LISTE_IMAGES: ${{ github.workspace }}/images-${{ matrix.cible }}.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: ${{ startsWith(matrix.cible, 'ms-') }}
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.cible }}/pom.xml
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction, publication et signature
        env:
          # Clé vérifiée par kyverno-images-signees.yaml (facultative : signature sans clé sinon).
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: infra/ci/construire-images.sh --pousser "${{ matrix.cible }}"
      - name: Références des images publiées
        uses: actions/upload-artifact@v7
        with:
          name: images-${{ matrix.cible }}
          path: images-${{ matrix.cible }}.txt
          retention-days: 30

  deploiement:
    name: Déploiement en recette
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: recette
    env:
      KUBECONFIG_CONTENU: ${{ secrets.KUBECONFIG }}
    steps:
      - name: Accès à la grappe
        if: ${{ env.KUBECONFIG_CONTENU == '' }}
        run: echo "::notice title=Déploiement::secret KUBECONFIG absent de l'environnement recette, déploiement sauté"
      - uses: actions/checkout@v7
        if: ${{ env.KUBECONFIG_CONTENU != '' }}
      - uses: azure/setup-kubectl@v5
        if: ${{ env.KUBECONFIG_CONTENU != '' }}
        with:
          version: v1.33.0
      - uses: actions/download-artifact@v7
        if: ${{ env.KUBECONFIG_CONTENU != '' }}
        with:
          pattern: images-*
          path: images
          merge-multiple: true
      - name: kubectl apply -k infra/kubernetes-gimac (images signées de ce commit)
        if: ${{ env.KUBECONFIG_CONTENU != '' }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_CONTENU" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          cat images/*.txt > "$RUNNER_TEMP/images.txt"
          infra/ci/deployer-recette.sh "$RUNNER_TEMP/images.txt"
